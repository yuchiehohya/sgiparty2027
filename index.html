<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17334e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="地區友好總會">
<title>2027 台中中區 地區友好總會</title>
<style>
  :root{
    --navy:#17334e; --navy-2:#24496b; --ink:#1d2733; --muted:#6b7684;
    --bg:#f5f3ee; --card:#ffffff; --line:#e4e0d6;
    --gold:#b98a2f; --gold-soft:#f6ecd6;
    --c-main:#17334e; --c-reh:#c0702b; --c-mini:#6a8f6b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55; font-size:15px;
    -webkit-text-size-adjust:100%;
  }
  button,input,select{font:inherit;color:inherit}

  /* ===== Header ===== */
  header{
    background:var(--navy); color:#fff;
    padding:calc(18px + env(safe-area-inset-top)) 18px 0;
  }
  .wrap{max-width:1040px;margin:0 auto}
  .eyebrow{font-size:12px;letter-spacing:.18em;opacity:.7}
  h1{margin:4px 0 2px;font-size:26px;letter-spacing:.06em;font-weight:700}
  .sub{font-size:13px;opacity:.8;margin-bottom:14px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .stat{background:rgba(255,255,255,.09);border-radius:10px;padding:7px 12px;font-size:12px}
  .stat b{display:block;font-size:18px;font-weight:700;letter-spacing:.02em}
  nav.tabs{display:flex;gap:4px}
  nav.tabs button{
    flex:1;max-width:180px;background:none;border:0;color:#fff;opacity:.65;
    padding:12px 8px 11px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;font-size:15px;
  }
  nav.tabs button.on{opacity:1;border-color:var(--gold)}

  main{padding:16px 14px 40px}
  .status{font-size:12px;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:#9aa3ad;display:inline-block}
  .dot.live{background:#3f9b5a}

  /* ===== Filters ===== */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters select,.filters input{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;
  }
  .filters input{flex:1;min-width:180px}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--navy);color:#fff}

  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-4px 0 12px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
  .legend label{cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .legend input{accent-color:var(--navy);margin:0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}

  /* ===== Calendar ===== */
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
  .cal-head h2{margin:0;font-size:18px;letter-spacing:.04em}
  .cal-head button{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px}
  .cal-head button:disabled{opacity:.3;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line)}
  .dow{font-size:12px;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
  .dow.we{color:var(--gold)}
  .day{
    min-height:64px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:5px 4px;cursor:pointer;position:relative;background:#fff;text-align:left;border-top:0;border-left:0;
    display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-width:0;
  }
  .day:nth-child(7n){border-right:0}
  .day.out{background:#faf9f6;color:#c3c7cc;cursor:default}
  .day .n{font-size:13px;font-weight:600;display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%}
  .day.today .n{background:var(--gold);color:#fff}
  .day.sel{background:var(--gold-soft)}
  .chips{display:flex;flex-direction:column;gap:2px;margin-top:2px}
  .chip{font-size:11px;line-height:1.35;border-radius:4px;padding:1px 4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.main{background:var(--c-main)} .chip.reh{background:var(--c-reh)} .chip.mini{background:var(--c-mini)}
  .more{font-size:10px;color:var(--muted);padding-left:2px}
  .dots{display:none;gap:3px;margin-top:4px;flex-wrap:wrap;justify-content:center}
  .dots i{width:6px;height:6px;border-radius:50%;display:block}
  .dots i.main{background:var(--c-main)} .dots i.reh{background:var(--c-reh)} .dots i.mini{background:var(--c-mini)}

  /* ===== Agenda ===== */
  .agenda{margin-top:14px}
  .agenda h3{font-size:15px;margin:0 0 8px;padding:0 2px;color:var(--navy)}
  .agenda h3 small{color:var(--muted);font-weight:400;margin-left:6px}
  .ev{
    display:flex;gap:12px;align-items:stretch;padding:12px;margin-bottom:8px;cursor:pointer;
    background:#fff;border:1px solid var(--line);border-radius:12px;width:100%;text-align:left;
  }
  .ev:hover{border-color:#c9c3b4}
  .ev .bar{width:4px;border-radius:4px;flex:none}
  .ev .bar.main{background:var(--c-main)} .ev .bar.reh{background:var(--c-reh)} .ev .bar.mini{background:var(--c-mini)}
  .ev .time{flex:none;width:52px;font-weight:700;font-size:15px;color:var(--navy)}
  .ev .t{font-weight:700;font-size:15px}
  .ev .tag{font-size:11px;padding:1px 7px;border-radius:20px;margin-left:6px;vertical-align:1px;font-weight:600}
  .tag.main{background:#e3eaf1;color:var(--c-main)} .tag.reh{background:#f7e6d6;color:var(--c-reh)} .tag.mini{background:#e3eee3;color:#4b6d4c}
  .ev .meta{font-size:13px;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:14px}
  .daygroup{margin-bottom:16px}

  /* ===== Staff ===== */
  .hq-title{font-size:13px;letter-spacing:.12em;color:var(--gold);font-weight:700;margin:18px 2px 8px}
  .staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
  .sc{padding:14px 14px 10px}
  .sc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;cursor:pointer}
  .sc-h h4{margin:0;font-size:18px;color:var(--navy)}
  .sc-h h4 small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
  .sc-h .when{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
  .sec{font-size:11px;letter-spacing:.14em;color:var(--muted);margin:10px 0 4px;font-weight:700}
  dl.roles{display:grid;grid-template-columns:92px 1fr;margin:0;font-size:14px}
  dl.roles dt{color:var(--muted);padding:4px 0;border-top:1px dashed var(--line);font-size:13px}
  dl.roles dd{margin:0;padding:4px 0;border-top:1px dashed var(--line)}
  dl.roles dt:first-of-type,dl.roles dd:first-of-type{border-top:0}
  mark{background:#ffe28a;padding:0 1px;border-radius:2px}
  .count{font-size:13px;color:var(--muted);margin:-4px 2px 6px}

  /* ===== Drawer ===== */
  .scrim{position:fixed;inset:0;background:rgba(15,25,35,.45);display:none;z-index:20}
  .scrim.open{display:block}
  .drawer{
    position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;z-index:21;
    background:#fff;border-radius:18px 18px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .25s ease,visibility .25s;visibility:hidden;
  }
  .drawer.open{transform:none;visibility:visible}
  .grab{width:40px;height:4px;border-radius:4px;background:#d7d3c9;margin:4px auto 12px}
  .drawer h2{margin:0;font-size:22px;color:var(--navy)}
  .drawer .path{font-size:13px;color:var(--muted);margin-bottom:12px}
  .close{position:absolute;right:14px;top:12px;border:0;background:#f1efe9;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
  .sched{display:grid;gap:8px;margin-bottom:6px}
  .sched div{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
  .sched b{display:block;font-size:12px}
  .sched .main b{color:var(--c-main)} .sched .reh b{color:var(--c-reh)} .sched .mini b{color:#4b6d4c}

  @media (min-width:760px){
    .drawer{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:18px 0 0 18px;transform:translateX(105%)}
    .drawer.open{transform:none}
    .grab{display:none}
    .day{min-height:96px}
  }
  @media (max-width:600px){
    h1{font-size:22px}
    .chips{display:none}
    .dots{display:flex}
    .day{min-height:54px;text-align:center;align-items:center}
    dl.roles{grid-template-columns:84px 1fr}
  }
  /* ===== Review form ===== */
  .rv-progress{padding:14px;margin-bottom:12px}
  .rv-progress .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .rv-progress .top b{font-size:15px;color:var(--navy)}
  .rv-progress .top span{font-size:13px;color:var(--muted)}
  .pbar{height:6px;background:#ece8de;border-radius:6px;overflow:hidden;margin-bottom:10px}
  .pbar i{display:block;height:100%;background:#3f9b5a;border-radius:6px}
  .dchips{display:flex;flex-wrap:wrap;gap:6px}
  .dchip{font-size:12px;padding:3px 9px;border-radius:20px;background:#f1efe9;color:var(--muted);border:0;cursor:pointer}
  .dchip.done{background:#e1f0e5;color:#2f7a46;font-weight:600}
  .dchip.done::before{content:"✓ "}
  .rv-form{padding:16px 14px 6px}
  .rv-form h2{margin:0 0 4px;font-size:18px;color:var(--navy);text-align:center;letter-spacing:.04em}
  .rv-form .hint{font-size:13px;color:var(--muted);text-align:center;margin:0 0 14px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
  .field.req > span::after{content:" *";color:#c0392b}
  .field input,.field select,.rv-form textarea,.it input,.it textarea{
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px;background:#fff;color:var(--ink);font-size:15px;width:100%;
  }
  .field input:focus,.field select:focus,.rv-form textarea:focus,.it input:focus,.it textarea:focus{outline:2px solid #a9bfd4;border-color:#a9bfd4}
  .loadbar{display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-soft);border-radius:10px;padding:9px 12px;font-size:13px;margin:8px 0}
  .loadbar.show{display:flex}
  .loadbar button{border:0;background:var(--navy);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
  .items{margin-top:10px}
  .it{border-top:1px solid var(--line);padding:12px 0}
  .it-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .it-h .no{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .it-h .no.pre{background:#d7d3c9;color:var(--ink);font-size:10px;width:auto;padding:0 8px;border-radius:13px}
  .it-h b{font-size:15px}
  .it-h .plan{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
  .times{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:8px}
  .tbox{display:flex;align-items:center;gap:6px;background:#faf9f6;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .tbox .tl{font-size:13px;font-weight:700;color:var(--navy);min-width:30px}
  .tbox input{width:54px!important;min-height:38px!important;padding:6px 4px!important;text-align:center}
  .tbox .u{font-size:13px;color:var(--muted)}
  .it textarea{width:100%;resize:vertical;min-height:42px}
  .diff.ok{color:#3f9b5a} .diff.over{color:#c0702b} .diff.under{color:#3f7fb5}
  .other{margin:12px 0 10px}
  .other textarea{min-height:96px}
  .submitbar{
    position:sticky;bottom:0;z-index:5;margin:0 -14px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(245,243,238,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
  }
  .total{font-size:13px;color:var(--muted);line-height:1.3}
  .total b{font-size:20px;color:var(--navy)}
  .total .d{font-weight:700}
  .submitbar button{margin-left:auto;border:0;background:var(--navy);color:#fff;font-weight:700;border-radius:12px;padding:12px 22px;font-size:15px;cursor:pointer}
  .submitbar button:disabled{opacity:.5;cursor:default}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2733;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .toast.err{background:#a93a2b}
  @media (max-width:600px){
    .fields{grid-template-columns:1fr}
  }
  .pick{padding:36px 18px;text-align:center;display:flex;flex-direction:column;gap:6px}
  .pick b{font-size:16px;color:var(--navy)}
  .pick span{font-size:13px;color:var(--muted)}
  [hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="eyebrow">台中中區 · 2027 年度</div>
    <h1>地區友好總會</h1>
    <div class="sub" id="range"></div>
    <div class="stats" id="stats"></div>
    <nav class="tabs">
      <button class="on" data-tab="cal">行事曆</button>
      <button data-tab="staff">工作人員一覽</button>
      <button data-tab="review">彩排檢討</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <p class="status"><span class="dot" id="srcDot"></span><span id="srcText">資料載入中…</span></p>

  <div class="filters" id="filters">
    <select id="fHq" aria-label="本部"><option value="">全部本部</option></select>
    <select id="fBranch" aria-label="支部"><option value="">全部支部</option></select>
    <input id="fSearch" type="search" placeholder="在此支部中搜尋姓名" hidden>
    <div class="seg" id="viewSeg">
      <button class="on" data-view="month">月曆</button>
      <button data-view="list">列表</button>
    </div>
  </div>

  <!-- 行事曆 -->
  <section id="tab-cal">
    <div class="legend">
      <label><input type="checkbox" data-type="main" checked><span style="--c:var(--c-main)">正式場次</span></label>
      <label><input type="checkbox" data-type="reh" checked><span style="--c:var(--c-reh)">彩排</span></label>
      <label><input type="checkbox" data-type="mini" checked><span style="--c:var(--c-mini)">沙推／小彩排</span></label>
    </div>
    <div id="monthView">
      <div class="card">
        <div class="cal-head">
          <button id="prev" aria-label="上個月">‹</button>
          <h2 id="monthTitle"></h2>
          <button id="next" aria-label="下個月">›</button>
        </div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="agenda" id="dayAgenda"></div>
    </div>
    <div id="listView" class="agenda" hidden></div>
  </section>

  <!-- 工作人員 -->
  <section id="tab-staff" hidden>
    <p class="count" id="staffCount"></p>
    <div id="staffList"></div>
  </section>
  <!-- 彩排檢討 -->
  <section id="tab-review" hidden>
    <div class="card rv-progress" id="rvProgress"></div>
    <form class="card rv-form" id="rvForm" autocomplete="off" novalidate>
      <h2>台中中區 地區總會彩排檢討表</h2>
      <p class="hint">請各地區在總會彩排結束後填寫送出。同一地區再次送出，會覆蓋上一份。</p>
      <div class="fields">
        <label class="field req"><span>地區</span><select id="rvDistrict"></select></label>
        <label class="field"><span>彩排日期</span><input id="rvDate" type="date"></label>
        <label class="field req"><span>填寫人</span><input id="rvFiller" placeholder="姓名"></label>
      </div>
      <div class="loadbar" id="loadbar"><span id="loadText"></span><button type="button" id="loadBtn">載入上次內容</button></div>
      <div class="items" id="rvItems"></div>
      <label class="field other"><span>其他檢討建議事項</span><textarea id="rvOther" placeholder="場地、動線、器材、時間掌控……"></textarea></label>
      <div class="submitbar">
        <div class="total" id="rvTotal"></div>
        <button type="submit" id="rvSubmit">送出</button>
      </div>
    </form>
  </section>
</main>
<div class="toast" id="toast"></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-modal="true" role="dialog">
  <div class="grab"></div>
  <button class="close" id="closeDrawer" aria-label="關閉">×</button>
  <div id="drawerBody"></div>
</aside>

<script>
/* ================================================================
   設定：部署 Apps Script 後，把網址貼在 API_URL
   ================================================================ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbx62-NK9vsRzDgKSLuaK732QAd0F4GheBsb5xfFpfyUeFRICW5XJklXHjxERMUd6QLz/exec',          // 例如 'https://script.google.com/macros/s/xxxxxx/exec'
  YEAR: 2026,           // 場次日期所在的年份（表上只有月/日）
  SNAPSHOT_DATE: '2026/11/23'
};

/* 離線快照：API 還沒設定或連不上時使用（已移除電話）
   欄位順序與 Code.gs 回傳的 rows 相同 */
const SNAPSHOT = [
["中清","同榮","洲際","12/13","日","15:30","台中會館(大)","12/3","四","19:30","台中會館(小>大)","","12/8／小彩","","","94","","男：林召翊","男:靖凱","曾詩涵","陳宣瑋","女：林雨蓁／女：李采蓁","區副婦人部長  蔡雪鳳","多寶表演","召翊","陳敬","簡之鈴","浩偉","成本毅","","","","","珞涵","淑媚","郁馨","維昀","宣瑋"],

const DEFAULT_REVIEW_ITEMS = [
  ['','地區活動剪影',30,false,false,false],['1','題目三唱',1,true,true],['2','司儀開場',1,false,true],

  ['9','總結',7,true,true],['10','題目三唱',1,true,true],['11','大合照',5,true,true]
];
const TYPE_LABEL = { main:'正式場次', reh:'彩排', mini:'沙推／小彩排' };
const WD = ['日','一','二','三','四','五','六'];

/* ===== State ===== */
let districts = [];
let events = [];
let reviewItems = DEFAULT_REVIEW_ITEMS;
let reviews = [];      // [{district, updated}]
let apiLive = false;
const state = { tab:'cal', view:'month', hq:'', branch:'', q:'', types:new Set(['main','reh','mini']), month:null, sel:null };

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const br = s => esc(s).replace(/／/g, '<br>');
const key = d => `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
function parseMD(s){
  const m = String(s||'').match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
  return m ? new Date(CONFIG.YEAR, +m[1]-1, +m[2]) : null;
}
const fmtDate = d => `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
function hl(text, q){
  const h = br(text);
  if(!q) return h;
  const qq = esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return h.replace(new RegExp(qq,'g'), m => `<mark>${m}</mark>`);
}

/* ===== Data → model ===== */
function build(rows){
  districts = rows.map(r => {
    // 小彩排：有時日期寫在備註欄（例如「12/8／小彩」）
    let mDate = parseMD(r[11]), mNote = r[12];
    if(!mDate && parseMD(r[12])){ mDate = parseMD(r[12]); }
    mNote = (mNote||'').replace(/^[（(][一二三四五六日][)）]$/,'').replace(/^\d{1,2}\/\d{1,2}／?/,'');
    return {
      hq:r[0], branch:r[1], name:r[2], target:r[15], raw:r,
      main:{ date:parseMD(r[3]), time:r[5], venue:r[6] },
      reh: { date:parseMD(r[7]), time:r[9], venue:r[10] },
      mini:{ date:mDate, time:r[13], venue:r[14], note:mNote }
    };
  });
  events = [];
  districts.forEach(d => ['main','reh','mini'].forEach(t => {
    if(d[t].date) events.push({ type:t, d, date:d[t].date, time:d[t].time||'', venue:d[t].venue||'', note:d[t].note||'' });
  }));
  events.sort((a,b) => a.date - b.date || (a.time||'99').localeCompare(b.time||'99'));
}

function inFilter(d){
  return (!state.hq || d.hq === state.hq) && (!state.branch || d.branch === state.branch);
}
function visibleEvents(){
  return events.filter(e => inFilter(e.d) && state.types.has(e.type));
}

/* ===== Header ===== */
function renderHeader(){
  const mains = events.filter(e => e.type==='main');
  const first = mains[0]?.date, last = mains[mains.length-1]?.date;
  $('#range').textContent = first ? `正式場次 ${first.getMonth()+1}/${first.getDate()} – ${last.getMonth()+1}/${last.getDate()}` : '';
  const target = districts.reduce((s,d) => s + (parseInt(d.target)||0), 0);
  const today = new Date(); today.setHours(0,0,0,0);
  const next = mains.find(e => e.date >= today);
  const daysLeft = next ? Math.round((next.date - today)/864e5) : null;
  $('#stats').innerHTML = `
    <div class="stat"><b>${districts.length}</b>地區場次</div>
    <div class="stat"><b>${target.toLocaleString()}</b>出席目標</div>
    ${next ? `<div class="stat"><b>${daysLeft===0?'今天':daysLeft+' 天'}</b>下一場：${esc(next.d.name)}</div>` : ''}`;
}

function fillFilters(){
  const hqs = [...new Set(districts.map(d => d.hq))];
  $('#fHq').innerHTML = '<option value="">全部本部</option>' + hqs.map(h => `<option ${h===state.hq?'selected':''}>${esc(h)}</option>`).join('');
  fillBranches();
}
function fillBranches(){
  const brs = [...new Set(districts.filter(d => !state.hq || d.hq===state.hq).map(d => d.branch))];
  if(state.branch && !brs.includes(state.branch)) state.branch = '';
  $('#fBranch').innerHTML = '<option value="">全部支部</option>' + brs.map(b => `<option ${b===state.branch?'selected':''}>${esc(b)}</option>`).join('');
}

/* ===== Calendar ===== */
function monthsWithEvents(){
  const s = new Set(events.map(e => `${e.date.getFullYear()}-${e.date.getMonth()}`));
  return [...s].map(x => x.split('-').map(Number)).sort((a,b) => a[0]-b[0] || a[1]-b[1]);
}
function renderMonth(){
  const [y,m] = state.month;
  $('#monthTitle').textContent = `${y} 年 ${m+1} 月`;
  const ms = monthsWithEvents();
  const idx = ms.findIndex(x => x[0]===y && x[1]===m);
  $('#prev').disabled = idx <= 0;
  $('#next').disabled = idx === -1 || idx >= ms.length-1;

  const byDay = {};
  visibleEvents().forEach(e => (byDay[key(e.date)] ||= []).push(e));

  const first = new Date(y,m,1), start = new Date(y,m,1-first.getDay());
  const lastDay = new Date(y,m+1,0);
  const cells = Math.ceil((first.getDay() + lastDay.getDate())/7)*7;
  const todayK = key(new Date());
  let html = WD.map((w,i) => `<div class="dow ${i===0||i===6?'we':''}">${w}</div>`).join('');
  for(let i=0;i<cells;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const out = d.getMonth() !== m, k = key(d), evs = byDay[k] || [];
    const chips = evs.slice(0,3).map(e => `<span class="chip ${e.type}">${e.type==='main'?'':TYPE_LABEL[e.type].slice(0,2)+'・'}${esc(e.d.name)}</span>`).join('')
      + (evs.length>3 ? `<span class="more">+${evs.length-3}</span>` : '');
    const dots = evs.map(e => `<i class="${e.type}"></i>`).join('');
    html += `<button class="day ${out?'out':''} ${k===todayK?'today':''} ${state.sel===k?'sel':''}" ${out?'disabled':''} data-k="${k}">
      <span class="n">${d.getDate()}</span>${out?'':`<div class="chips">${chips}</div><div class="dots">${dots}</div>`}</button>`;
  }
  $('#grid').innerHTML = html;
  $('#grid').querySelectorAll('.day:not(.out)').forEach(b => b.onclick = () => { state.sel = b.dataset.k; renderMonth(); });
  renderDayAgenda(byDay);
}
function renderDayAgenda(byDay){
  const el = $('#dayAgenda');
  if(!state.sel){ el.innerHTML = ''; return; }
  const [y,m,d] = state.sel.split('-').map(Number);
  const date = new Date(y,m-1,d);
  const evs = byDay[state.sel] || [];
  el.innerHTML = `<h3>${fmtDate(date)}<small>${evs.length ? evs.length+' 項' : ''}</small></h3>` +
    (evs.length ? evs.map(evHTML).join('') : '<div class="empty">這天沒有安排</div>');
  bindEv(el);
}
function evHTML(e){
  const d = e.d;
  return `<button class="ev" data-n="${esc(d.name)}">
    <span class="bar ${e.type}"></span>
    <span class="time">${esc(e.time||'—')}</span>
    <span><span class="t">${esc(d.name)}</span><span class="tag ${e.type}">${TYPE_LABEL[e.type]}</span>
      <div class="meta">${esc(d.branch)}支部 · ${esc(e.venue||'地點未定')}${e.note?' · '+esc(e.note):''}</div></span>
  </button>`;
}
function bindEv(root){ root.querySelectorAll('.ev').forEach(b => b.onclick = () => openDistrict(b.dataset.n)); }

function renderList(){
  const today = new Date(); today.setHours(0,0,0,0);
  const evs = visibleEvents();
  const groups = {};
  evs.forEach(e => (groups[key(e.date)] ||= { date:e.date, items:[] }).items.push(e));
  const arr = Object.values(groups);
  const html = arr.map(g => `<div class="daygroup" ${g.date<today?'style="opacity:.55"':''}>
      <h3>${fmtDate(g.date)}${g.date<today?'<small>已結束</small>':''}</h3>${g.items.map(evHTML).join('')}</div>`).join('');
  $('#listView').innerHTML = html || '<div class="empty">沒有符合的場次</div>';
  bindEv($('#listView'));
  const firstUpcoming = [...$('#listView').querySelectorAll('.daygroup')].find(x => !x.style.opacity);
  if(firstUpcoming && state._scrollList){ firstUpcoming.scrollIntoView({block:'start'}); state._scrollList=false; }
}

/* ===== Staff ===== */
function rolesHTML(d, q){
  return ROLE_GROUPS.map(g => {
    // 合併同名角色（例如兩欄創價班）
    const merged = [];
    g.roles.forEach(([i,label]) => {
      const v = d.raw[i];
      if(!v) return;
      const ex = merged.find(x => x.label===label);
      ex ? ex.vals.push(v) : merged.push({label, vals:[v]});
    });
    if(!merged.length) return '';
    return `<div class="sec">${g.name}</div><dl class="roles">` +
      merged.map(x => `<dt>${x.label}</dt><dd>${hl(x.vals.join('、'), q)}</dd>`).join('') + '</dl>';
  }).join('');
}
function renderStaff(){
  if(!state.hq || !state.branch){
    $('#fSearch').hidden = true;
    $('#staffCount').textContent = '';
    $('#staffList').innerHTML = `<div class="card pick"><b>請先選擇本部和支部</b>
      <span>${!state.hq ? '先在上方選擇「本部」，再選擇「支部」' : `已選 ${esc(state.hq)}本部，請再選擇「支部」`}</span></div>`;
    return;
  }
  $('#fSearch').hidden = false;
  const q = state.q.trim();
  const list = districts.filter(inFilter).filter(d => !q || d.raw.join('|').includes(q) || d.branch.includes(q));
  $('#staffCount').textContent = q ? `找到 ${list.length} 個地區有「${q}」` : `共 ${list.length} 個地區`;
  const byHq = {};
  list.forEach(d => (byHq[d.hq] ||= []).push(d));
  $('#staffList').innerHTML = Object.entries(byHq).map(([hq, ds]) =>
    `<div class="hq-title">${esc(hq)}本部</div><div class="staff-grid">` +
    ds.map(d => `<article class="card sc">
        <div class="sc-h" data-n="${esc(d.name)}">
          <h4>${hl(d.name,q)}<small>${esc(d.branch)}支部</small></h4>
          <div class="when">${d.main.date?fmtDate(d.main.date):''}<br>${esc(d.main.time)} ${esc(d.main.venue)}</div>
        </div>${rolesHTML(d,q) || '<div class="empty">尚未填寫</div>'}
      </article>`).join('') + '</div>'
  ).join('') || '<div class="empty">沒有符合的地區</div>';
  $('#staffList').querySelectorAll('.sc-h').forEach(h => h.onclick = () => openDistrict(h.dataset.n));
}

/* ===== Drawer ===== */
function openDistrict(name){
  const d = districts.find(x => x.name===name); if(!d) return;
  const row = (t, o) => o.date ? `<div class="${t}"><b>${TYPE_LABEL[t]}</b>${fmtDate(o.date)} ${esc(o.time)}<br>${esc(o.venue||'地點未定')}${o.note?'<br>'+esc(o.note):''}</div>` : '';
  $('#drawerBody').innerHTML = `
    <h2>${esc(d.name)}</h2>
    <div class="path">${esc(d.hq)}本部 · ${esc(d.branch)}支部${d.target?` · 出席目標 ${esc(d.target)} 人`:''}</div>
    <div class="sched">${row('main',d.main)}${row('reh',d.reh)}${row('mini',d.mini)}</div>
    ${rolesHTML(d, state.tab==='staff' ? state.q.trim() : '')}`;
  $('#drawer').classList.add('open'); $('#scrim').classList.add('open');
}
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#scrim').onclick = closeDrawer; $('#closeDrawer').onclick = closeDrawer;
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDrawer(); });


/* ===== Storage（瀏覽器暫存：通關碼、草稿）===== */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200);
}
async function api(body){
  const res = await fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body) });
  return res.json();
}
const isoDate = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : '';

/* ===== 彩排檢討 ===== */
let rvReady = false;
function setupReview(){
  // 地區選單（依支部分組）
  const groups = {};
  districts.forEach(d => (groups[d.hq+'本部 · '+d.branch+'支部'] ||= []).push(d));
  $('#rvDistrict').innerHTML = '<option value="">請選擇地區</option>' + Object.entries(groups).map(([g,ds]) =>
    `<optgroup label="${esc(g)}">${ds.map(d => `<option value="${esc(d.name)}">${esc(d.name)}</option>`).join('')}</optgroup>`).join('');
  // 項目
  const timeBox = (f, label, name) => `<div class="tbox"><span class="tl">${label}</span>
      <input type="number" inputmode="numeric" min="0" step="1" data-f="${f}m" aria-label="${esc(name)} ${label} 分"><span class="u">分</span>
      <input type="number" inputmode="numeric" min="0" max="59" step="1" data-f="${f}s" aria-label="${esc(name)} ${label} 秒"><span class="u">秒</span></div>`;
  $('#rvItems').innerHTML = reviewItems.map((it,i) => {
    const [no,name,plan,cue,count] = it, timed = it[5] !== false;
    return `<div class="it" data-i="${i}">
      <div class="it-h"><span class="no ${no?'':'pre'}">${no?esc(no):'開場前'}</span><b>${esc(name)}</b>
        <span class="plan">預計 ${plan} 分${timed?'':'・不需記錄時間'}<span class="diff"></span></span></div>
      ${timed ? `<div class="times">${cue ? timeBox('cue','串場',name) + timeBox('prog','程序',name) : timeBox('prog','實際',name)}</div>` : ''}
      <textarea rows="1" data-f="note" placeholder="檢討建議"></textarea></div>`;
  }).join('');
  const saved = store.get('rvMeta') || {};
  $('#rvFiller').value = saved.filler || '';
  rvReady = true;
  updateTotal();
}

function renderProgress(){
  const done = new Map(reviews.map(r => [r.district, r.updated]));
  const n = districts.filter(d => done.has(d.name)).length;
  const pct = districts.length ? Math.round(n / districts.length * 100) : 0;
  $('#rvProgress').innerHTML = `
    <div class="top"><b>檢討表回傳進度</b><span>${apiLive ? `${n} / ${districts.length} 個地區` : '連接試算表後顯示'}</span></div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="dchips">${districts.map(d => `<button type="button" class="dchip ${done.has(d.name)?'done':''}" data-n="${esc(d.name)}"
      title="${done.has(d.name)?'已回傳 '+esc(done.get(d.name)):'尚未回傳'}">${esc(d.name)}</button>`).join('')}</div>`;
  $('#rvProgress').querySelectorAll('.dchip').forEach(b => b.onclick = () => {
    $('#rvDistrict').value = b.dataset.n; onDistrictChange();
    $('#rvForm').scrollIntoView({behavior:'smooth', block:'start'});
  });
}

/* 分、秒欄位 ↔ 秒數 */
function getSec(el, f){
  const m = el.querySelector(`[data-f=${f}m]`), s = el.querySelector(`[data-f=${f}s]`);
  if(!m) return '';
  if(m.value === '' && s.value === '') return '';
  return Math.max(0, Math.round((+m.value || 0) * 60 + (+s.value || 0)));
}
function setSec(el, f, v){
  const m = el.querySelector(`[data-f=${f}m]`), s = el.querySelector(`[data-f=${f}s]`);
  if(!m) return;
  if(v === '' || v == null || isNaN(+v)){ m.value = ''; s.value = ''; return; }
  m.value = Math.floor(+v / 60); s.value = +v % 60;
}
function fmtSec(t){
  const m = Math.floor(t / 60), r = t % 60;
  if(!m) return r + '秒';
  return r ? `${m}分${r}秒` : `${m}分`;
}

function collect(){
  const items = [...document.querySelectorAll('#rvItems .it')].map(el => ({
    cue: getSec(el, 'cue'), prog: getSec(el, 'prog'),
    note: el.querySelector('[data-f=note]').value
  }));
  const d = districts.find(x => x.name === $('#rvDistrict').value);
  return {
    district: $('#rvDistrict').value, hq: d?.hq || '', branch: d?.branch || '',
    date: $('#rvDate').value.replace(/-/g,'/'), filler: $('#rvFiller').value.trim(),
    items, other: $('#rvOther').value
  };
}
function fill(data){
  const els = document.querySelectorAll('#rvItems .it');
  els.forEach((el,i) => {
    const v = (data.items || [])[i] || {};
    setSec(el, 'cue', v.cue ?? '');
    setSec(el, 'prog', v.prog ?? '');
    el.querySelector('[data-f=note]').value = v.note ?? '';
  });
  $('#rvOther').value = data.other ?? '';
  if(data.date) $('#rvDate').value = String(data.date).replace(/\//g,'-');
  if(data.filler && !$('#rvFiller').value) $('#rvFiller').value = data.filler;
  document.querySelectorAll('#rvForm textarea').forEach(autoGrow);
  updateTotal();
}
function clearItems(){ fill({ items:[], other:'' }); }

function updateTotal(){
  let actual = 0, plan = 0, filled = 0;
  document.querySelectorAll('#rvItems .it').forEach((el,i) => {
    const [, , p, , count] = reviewItems[i];
    const c = getSec(el, 'cue'), g = getSec(el, 'prog');
    const diff = el.querySelector('.diff');
    if(c !== '' || g !== ''){
      const t = (c || 0) + (g || 0), dv = t - p * 60;
      diff.textContent = `・小計 ${fmtSec(t)}` + (dv > 0 ? `（超過 ${fmtSec(dv)}）` : dv < 0 ? `（少 ${fmtSec(-dv)}）` : '');
      diff.className = 'diff ' + (dv > 0 ? 'over' : dv < 0 ? 'under' : 'ok');
      if(count){ actual += t; filled++; }
    } else diff.textContent = '';
    if(count) plan += p;
  });
  const d = actual - plan * 60;
  $('#rvTotal').innerHTML = filled
    ? `實際合計 <b>${fmtSec(actual)}</b><br>預計 ${plan} 分 · <span class="d" style="color:${d>0?'#c0702b':d<0?'#3f7fb5':'#3f9b5a'}">${d>0?'超過 '+fmtSec(d):d<0?'少 '+fmtSec(-d):'剛好'}</span>`
    : `預計合計 <b>${plan}</b> 分<br>填入時間後自動加總`;
}
function autoGrow(t){ t.style.height = 'auto'; t.style.height = Math.max(42, t.scrollHeight + 2) + 'px'; }

function saveDraft(){
  const d = $('#rvDistrict').value; if(!d) return;
  store.set('rvDraft:' + d, collect());
}

function onDistrictChange(){
  const name = $('#rvDistrict').value;
  const d = districts.find(x => x.name === name);
  $('#rvDate').value = d ? isoDate(d.reh.date) : '';
  clearItems();
  const draft = name && store.get('rvDraft:' + name);
  if(draft) fill(draft);
  const done = reviews.find(r => r.district === name);
  $('#loadbar').classList.toggle('show', !!done);
  if(done) $('#loadText').textContent = `${name} 已於 ${done.updated} 回傳過${draft ? '（目前顯示的是這台裝置上的草稿）' : ''}`;
}

async function loadExisting(){
  const name = $('#rvDistrict').value, pass = '';
  $('#loadBtn').disabled = true;
  try{
    const r = await api({ action:'load', pass, district:name });
    if(!r.ok) throw new Error(r.error);
    if(!r.data){ toast('試算表裡找不到這個地區的資料', true); return; }
    fill(r.data); saveDraft();
    toast('已載入上次送出的內容');
  }catch(e){ toast(e.message || '載入失敗，請稍後再試', true); }
  finally{ $('#loadBtn').disabled = false; }
}

async function submitReview(ev){
  ev.preventDefault();
  const data = collect(), pass = '';
  if(!data.district){ toast('請選擇地區', true); $('#rvDistrict').focus(); return; }
  if(!data.filler){ toast('請填寫填寫人', true); $('#rvFiller').focus(); return; }
  if(!CONFIG.API_URL){ toast('網站尚未連接試算表，暫時無法送出', true); return; }
  const btn = $('#rvSubmit'); btn.disabled = true; btn.textContent = '送出中…';
  try{
    const r = await api({ action:'submit', pass, data });
    if(!r.ok) throw new Error(r.error);
    store.set('rvMeta', { filler:data.filler });
    store.del('rvDraft:' + data.district);
    const i = reviews.findIndex(x => x.district === data.district);
    i >= 0 ? reviews[i].updated = r.updated : reviews.push({ district:data.district, updated:r.updated });
    renderProgress();
    $('#loadbar').classList.add('show');
    $('#loadText').textContent = `${data.district} 已於 ${r.updated} 回傳過`;
    toast(r.overwritten ? `已更新 ${data.district} 的檢討表` : `已送出 ${data.district} 的檢討表，謝謝！`);
  }catch(e){
    toast(e.message === 'Failed to fetch' ? '網路連線失敗，內容已暫存在這台裝置，請稍後再送一次' : (e.message || '送出失敗'), true);
  }finally{ btn.disabled = false; btn.textContent = '送出'; }
}

$('#rvDistrict').onchange = onDistrictChange;
$('#rvForm').addEventListener('change', e => {
  const f = e.target.dataset.f || '';
  if(!/^(cue|prog)[ms]$/.test(f) || e.target.value === '') return;
  let v = Math.max(0, Math.floor(+e.target.value || 0));
  // 秒數超過 59 時，自動進位到分
  if(f.endsWith('s') && v > 59){
    const box = e.target.closest('.tbox'), m = box.querySelector('[data-f$=m]');
    m.value = (+m.value || 0) + Math.floor(v / 60); v = v % 60;
  }
  e.target.value = v; updateTotal(); saveDraft();
});
$('#loadBtn').onclick = loadExisting;
$('#rvForm').addEventListener('submit', submitReview);
$('#rvForm').addEventListener('input', e => {
  if(e.target.matches('textarea')) autoGrow(e.target);
  if(/^(cue|prog)[ms]$/.test(e.target.dataset.f || '')) updateTotal();
  clearTimeout(saveDraft._t); saveDraft._t = setTimeout(saveDraft, 400);
});

/* ===== Render ===== */
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===state.tab));
  $('#tab-cal').hidden = state.tab!=='cal';
  $('#tab-staff').hidden = state.tab!=='staff';
  $('#tab-review').hidden = state.tab!=='review';
  $('#filters').hidden = state.tab==='review';
  $('#viewSeg').hidden = state.tab!=='cal';
  $('#fSearch').hidden = state.tab!=='staff';
  if(state.tab==='cal'){
    document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.view===state.view));
    $('#monthView').hidden = state.view!=='month';
    $('#listView').hidden = state.view!=='list';
    state.view==='month' ? renderMonth() : renderList();
  } else if(state.tab==='staff') renderStaff();
  else { if(!rvReady) setupReview(); renderProgress(); }
}

/* ===== Events ===== */
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => { state.view = b.dataset.view; state._scrollList = b.dataset.view==='list'; render(); });
$('#fHq').onchange = e => { state.hq = e.target.value; fillBranches(); render(); };
$('#fBranch').onchange = e => {
  state.branch = e.target.value;
  // 只選支部時，自動帶入所屬本部
  const d = districts.find(x => x.branch === state.branch);
  if(state.branch && d && !state.hq){ state.hq = d.hq; fillFilters(); }
  render();
};
$('#fSearch').oninput = e => { state.q = e.target.value; render(); };
document.querySelectorAll('.legend input').forEach(c => c.onchange = () => { c.checked ? state.types.add(c.dataset.type) : state.types.delete(c.dataset.type); render(); });
$('#prev').onclick = () => stepMonth(-1);
$('#next').onclick = () => stepMonth(1);
function stepMonth(n){
  const ms = monthsWithEvents();
  const i = ms.findIndex(x => x[0]===state.month[0] && x[1]===state.month[1]);
  if(ms[i+n]){ state.month = ms[i+n]; state.sel = null; render(); }
}

/* ===== Boot ===== */
function start(rows, source, extra = {}){
  if(Array.isArray(extra.reviewItems) && extra.reviewItems.length) reviewItems = extra.reviewItems;
  reviews = extra.reviews || [];
  apiLive = !!source.live;
  build(rows);
  const today = new Date(); today.setHours(0,0,0,0);
  const next = events.find(e => e.date >= today) || events[0];
  const focus = next ? next.date : today;
  state.month = [focus.getFullYear(), focus.getMonth()];
  state.sel = key(focus);
  const qTab = new URLSearchParams(location.search).get('tab');
  if(['cal','staff','review'].includes(qTab)) state.tab = qTab;
  renderHeader(); fillFilters(); render();
  $('#srcDot').classList.toggle('live', source.live);
  $('#srcText').textContent = source.text;
}

async function boot(){
  if(CONFIG.API_URL){
    try{
      const res = await fetch(CONFIG.API_URL, { cache:'no-store' });
      const data = await res.json();
      if(!Array.isArray(data.rows)) throw new Error('bad data');
      start(data.rows, { live:true, text:`與 Google 試算表同步 · 更新於 ${data.updated}` }, data);
      return;
    }catch(err){
      console.warn('API 讀取失敗，改用快照', err);
      start(SNAPSHOT, { live:false, text:`無法連線到試算表，目前顯示 ${CONFIG.SNAPSHOT_DATE} 的資料` });
      return;
    }
  }
  start(SNAPSHOT, { live:false, text:`目前顯示 ${CONFIG.SNAPSHOT_DATE} 的資料（尚未連接試算表）` });
}
boot();
</script>
