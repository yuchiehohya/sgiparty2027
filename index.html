<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff6ee">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="地區友好總會">
<title>2027 台中中區 地區友好總會</title>
<style>
  :root{
    --navy:#0e7c6b; --navy-2:#13a08a; --ink:#24323d; --muted:#6f7f8a;
    --bg:#f4fbf8; --card:#ffffff; --line:#e3efea;
    --gold:#ff8a5c; --gold-soft:#fff1e6;
    --mint:#16b39a; --mint-soft:#e3f7f1; --coral:#ff7a59; --sun:#ffc94a; --sky:#47a9e6; --lav:#9b8cf2;
    --c-main:#16b39a; --c-reh:#ff7a59; --c-mini:#47a9e6;
    --radius:18px; --shadow:0 2px 4px rgba(16,80,66,.04),0 8px 24px rgba(16,80,66,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55; font-size:15px;
    -webkit-text-size-adjust:100%;
  }
  button,input,select{font:inherit;color:inherit}

  /* ===== Header ===== */
  header{
    background:var(--navy); color:#fff;
    padding:calc(18px + env(safe-area-inset-top)) 18px 0;
  }
  .wrap{max-width:1040px;margin:0 auto}
  .eyebrow{font-size:12px;letter-spacing:.18em;opacity:.7}
  h1{margin:4px 0 2px;font-size:26px;letter-spacing:.06em;font-weight:700}
  .sub{font-size:13px;opacity:.8;margin-bottom:14px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .stat{background:rgba(255,255,255,.09);border-radius:10px;padding:7px 12px;font-size:12px}
  .stat b{display:block;font-size:18px;font-weight:700;letter-spacing:.02em}
  nav.tabs{display:flex;gap:4px}
  nav.tabs button{
    flex:1;max-width:180px;background:none;border:0;color:#fff;opacity:.65;
    padding:12px 8px 11px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;font-size:15px;
  }
  nav.tabs button.on{opacity:1;border-color:var(--gold)}

  main{padding:16px 14px 40px}
  .status{font-size:12px;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:#9aa3ad;display:inline-block}
  .dot.live{background:#3f9b5a}

  /* ===== Filters ===== */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters select,.filters input{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px;
  }
  .filters input{flex:1;min-width:180px}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--navy);color:#fff}

  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-4px 0 12px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
  .legend label{cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .legend input{accent-color:var(--navy);margin:0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}

  /* ===== Calendar ===== */
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
  .cal-head h2{margin:0;font-size:18px;letter-spacing:.04em}
  .cal-head button{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px}
  .cal-head button:disabled{opacity:.3;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line)}
  .dow{font-size:12px;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
  .dow.we{color:var(--gold)}
  .day{
    min-height:64px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:5px 4px;cursor:pointer;position:relative;background:#fff;text-align:left;border-top:0;border-left:0;
    display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-width:0;
  }
  .day:nth-child(7n){border-right:0}
  .day.out{background:#faf9f6;color:#c3c7cc;cursor:default}
  .day .n{font-size:13px;font-weight:600;display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%}
  .day.today .n{background:var(--gold);color:#fff}
  .day.sel{background:var(--gold-soft)}
  .chips{display:flex;flex-direction:column;gap:2px;margin-top:2px}
  .chip{font-size:11px;line-height:1.35;border-radius:4px;padding:1px 4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.main{background:var(--c-main)} .chip.reh{background:var(--c-reh)} .chip.mini{background:var(--c-mini)}
  .more{font-size:10px;color:var(--muted);padding-left:2px}
  .dots{display:none;gap:3px;margin-top:4px;flex-wrap:wrap;justify-content:center}
  .dots i{width:6px;height:6px;border-radius:50%;display:block}
  .dots i.main{background:var(--c-main)} .dots i.reh{background:var(--c-reh)} .dots i.mini{background:var(--c-mini)}

  /* ===== Agenda ===== */
  .agenda{margin-top:14px}
  .agenda h3{font-size:15px;margin:0 0 8px;padding:0 2px;color:var(--navy)}
  .agenda h3 small{color:var(--muted);font-weight:400;margin-left:6px}
  .ev{
    display:flex;gap:12px;align-items:stretch;padding:12px;margin-bottom:8px;cursor:pointer;
    background:#fff;border:1px solid var(--line);border-radius:12px;width:100%;text-align:left;
  }
  .ev:hover{border-color:#c9c3b4}
  .ev .bar{width:4px;border-radius:4px;flex:none}
  .ev .bar.main{background:var(--c-main)} .ev .bar.reh{background:var(--c-reh)} .ev .bar.mini{background:var(--c-mini)}
  .ev .time{flex:none;width:52px;font-weight:700;font-size:15px;color:var(--navy)}
  .ev .t{font-weight:700;font-size:15px}
  .ev .tag{font-size:11px;padding:1px 7px;border-radius:20px;margin-left:6px;vertical-align:1px;font-weight:600}
  .tag.main{background:#e3eaf1;color:var(--c-main)} .tag.reh{background:#f7e6d6;color:var(--c-reh)} .tag.mini{background:#e3eee3;color:#4b6d4c}
  .ev .meta{font-size:13px;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:14px}
  .daygroup{margin-bottom:16px}

  /* ===== Staff ===== */
  .hq-title{font-size:13px;letter-spacing:.12em;color:var(--gold);font-weight:700;margin:18px 2px 8px}
  .staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
  .sc{padding:14px 14px 10px}
  .sc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;cursor:pointer}
  .sc-h h4{margin:0;font-size:18px;color:var(--navy)}
  .sc-h h4 small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
  .sc-h .when{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
  .sec{font-size:11px;letter-spacing:.14em;color:var(--muted);margin:10px 0 4px;font-weight:700}
  dl.roles{display:grid;grid-template-columns:92px 1fr;margin:0;font-size:14px}
  dl.roles dt{color:var(--muted);padding:4px 0;border-top:1px dashed var(--line);font-size:13px}
  dl.roles dd{margin:0;padding:4px 0;border-top:1px dashed var(--line)}
  dl.roles dt:first-of-type,dl.roles dd:first-of-type{border-top:0}
  mark{background:#ffe28a;padding:0 1px;border-radius:2px}
  .count{font-size:13px;color:var(--muted);margin:-4px 2px 6px}

  /* ===== Drawer ===== */
  .scrim{position:fixed;inset:0;background:rgba(15,25,35,.45);display:none;z-index:20}
  .scrim.open{display:block}
  .drawer{
    position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;z-index:21;
    background:#fff;border-radius:18px 18px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .25s ease,visibility .25s;visibility:hidden;
  }
  .drawer.open{transform:none;visibility:visible}
  .grab{width:40px;height:4px;border-radius:4px;background:#d7d3c9;margin:4px auto 12px}
  .drawer h2{margin:0;font-size:22px;color:var(--navy)}
  .drawer .path{font-size:13px;color:var(--muted);margin-bottom:12px}
  .close{position:absolute;right:14px;top:12px;border:0;background:#f1efe9;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
  .sched{display:grid;gap:8px;margin-bottom:6px}
  .sched div{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
  .sched b{display:block;font-size:12px}
  .sched .main b{color:var(--c-main)} .sched .reh b{color:var(--c-reh)} .sched .mini b{color:#4b6d4c}

  @media (min-width:760px){
    .drawer{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:18px 0 0 18px;transform:translateX(105%)}
    .drawer.open{transform:none}
    .grab{display:none}
    .day{min-height:96px}
  }
  @media (max-width:600px){
    h1{font-size:22px}
    .chips{display:none}
    .dots{display:flex}
    .day{min-height:54px;text-align:center;align-items:center}
    dl.roles{grid-template-columns:84px 1fr}
  }
  /* ===== Review form ===== */
  .rv-progress{padding:14px;margin-bottom:12px}
  .rv-progress .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .rv-progress .top b{font-size:15px;color:var(--navy)}
  .rv-progress .top span{font-size:13px;color:var(--muted)}
  .pbar{height:6px;background:#ece8de;border-radius:6px;overflow:hidden;margin-bottom:10px}
  .pbar i{display:block;height:100%;background:#3f9b5a;border-radius:6px}
  .dchips{display:flex;flex-wrap:wrap;gap:6px}
  .dchip{font-size:12px;padding:3px 9px;border-radius:20px;background:#f1efe9;color:var(--muted);border:0;cursor:pointer}
  .dchip.done{background:#e1f0e5;color:#2f7a46;font-weight:600}
  .dchip.done::before{content:"✓ "}
  .dchip .cnt{display:inline-block;margin-left:4px;min-width:16px;padding:0 4px;border-radius:8px;background:#0e9c84;color:#fff;font-size:10px;line-height:16px;text-align:center}
  .rv-form{padding:16px 14px 6px}
  .rv-form h2{margin:0 0 4px;font-size:18px;color:var(--navy);text-align:center;letter-spacing:.04em}
  .rv-form .hint{font-size:13px;color:var(--muted);text-align:center;margin:0 0 14px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
  .field.req > span::after{content:" *";color:#c0392b}
  .field input,.field select,.rv-form textarea,.it input,.it textarea{
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px;background:#fff;color:var(--ink);font-size:15px;width:100%;
  }
  .field input:focus,.field select:focus,.rv-form textarea:focus,.it input:focus,.it textarea:focus{outline:2px solid #a9bfd4;border-color:#a9bfd4}
  .loadbar{display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-soft);border-radius:10px;padding:9px 12px;font-size:13px;margin:8px 0}
  .loadbar.show{display:flex}
  .loadbar button{border:0;background:var(--navy);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
  .items{margin-top:10px}
  .it{border-top:1px solid var(--line);padding:12px 0}
  .it-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .it-h .no{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .it-h .no.pre{background:#d7d3c9;color:var(--ink);font-size:10px;width:auto;padding:0 8px;border-radius:13px}
  .it-h b{font-size:15px}
  .it-h .plan{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
  .times{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:8px}
  .tbox{display:flex;align-items:center;gap:6px;background:#faf9f6;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .tbox .tl{font-size:13px;font-weight:700;color:var(--navy);min-width:30px}
  .tbox input{width:54px!important;min-height:38px!important;padding:6px 4px!important;text-align:center}
  .tbox .u{font-size:13px;color:var(--muted)}
  .it textarea{width:100%;resize:vertical;min-height:42px}
  .diff.ok{color:#0e9c84} .diff.over{color:#e0623e} .diff.under{color:#2f8fcf}
  .other{margin:12px 0 10px}
  .other textarea{min-height:96px}
  .submitbar{
    position:sticky;bottom:0;z-index:5;margin:0 -14px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(245,243,238,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
  }
  .total{font-size:13px;color:var(--muted);line-height:1.3}
  .total b{font-size:20px;color:var(--navy)}
  .total .d{font-weight:700}
  .submitbar button{margin-left:auto;border:0;background:var(--navy);color:#fff;font-weight:700;border-radius:12px;padding:12px 22px;font-size:15px;cursor:pointer}
  .submitbar button:disabled{opacity:.5;cursor:default}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2733;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .toast.err{background:#a93a2b}
  @media (max-width:600px){
    .fields{grid-template-columns:1fr}
  }
  .pick{padding:36px 18px;text-align:center;display:flex;flex-direction:column;gap:6px}
  .pick b{font-size:16px;color:var(--navy)}
  .pick span{font-size:13px;color:var(--muted)}

  /* =================================================================
     活潑清新主題
     ================================================================= */
  body{background:
    radial-gradient(900px 400px at 100% 0%, #e9f6ff 0%, transparent 60%),
    radial-gradient(700px 380px at 0% 10%, #fff4e8 0%, transparent 55%),
    var(--bg)}
  header{
    position:relative;overflow:hidden;color:var(--ink);
    background:linear-gradient(135deg,#d6f5ea 0%,#e6f4ff 55%,#fff1e4 100%);
    padding-bottom:16px;
  }
  header::before,header::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
  header::before{width:220px;height:220px;right:-60px;top:-80px;background:radial-gradient(circle,#ffd66b 0%,rgba(255,214,107,0) 70%);opacity:.75}
  header::after{width:160px;height:160px;left:-50px;bottom:-70px;background:radial-gradient(circle,#8fe3cf 0%,rgba(143,227,207,0) 70%);opacity:.8}
  header .wrap{position:relative;z-index:1}
  .eyebrow{opacity:1;color:var(--navy);font-weight:700;letter-spacing:.14em;display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.7);padding:4px 10px;border-radius:20px}
  .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--coral)}
  h1{font-size:30px;color:#12493f;margin-top:10px;letter-spacing:.08em}
  .sub{opacity:1;color:#4a6a63}
  .stat{background:#fff;box-shadow:var(--shadow);border-radius:16px;padding:9px 14px;color:var(--muted);position:relative;padding-left:18px}
  .stat::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--mint)}
  .stat:nth-child(2)::before{background:var(--coral)} .stat:nth-child(3)::before{background:var(--sun)}
  .stat b{color:var(--ink);font-size:20px}
  nav.tabs{background:rgba(255,255,255,.75);backdrop-filter:blur(6px);border-radius:999px;padding:5px;gap:4px;box-shadow:var(--shadow);max-width:520px}
  nav.tabs button{color:var(--muted);opacity:1;border:0;border-radius:999px;padding:10px 8px;max-width:none;transition:background .2s,color .2s}
  nav.tabs button.on{background:var(--mint);color:#fff;box-shadow:0 4px 12px rgba(22,179,154,.35)}

  .card{border:0;box-shadow:var(--shadow)}
  .filters select,.filters input{border:0;box-shadow:var(--shadow);border-radius:14px}
  .seg{border:0;box-shadow:var(--shadow);border-radius:14px}
  .seg button{border-radius:11px}
  .seg button.on{background:var(--mint)}
  .legend input{accent-color:var(--mint)}
  .legend span::before{border-radius:50%}

  .cal-head h2{color:#12493f}
  .cal-head button{border:0;background:var(--mint-soft);color:var(--navy);border-radius:12px}
  .grid{border-top-color:var(--line)}
  .dow{font-weight:700}
  .dow.we{color:var(--coral)}
  .day.today .n{background:var(--sun);color:#5a4100}
  .day.sel{background:var(--mint-soft)}
  .day:hover:not(.out){background:#f7fcfa}
  .day.out{background:#f8fbfa;color:#c9d3cf}
  .day.sel:hover{background:var(--mint-soft)}
  .chip{border-radius:999px;padding:1px 7px;font-weight:600}
  .ev{border:0;box-shadow:var(--shadow);border-radius:16px;transition:transform .15s}
  .ev:hover{transform:translateY(-1px)}
  .ev .time{color:#12493f}
  .tag.main{background:var(--mint-soft);color:#0e7c6b} .tag.reh{background:#ffece5;color:#d4532f} .tag.mini{background:#e4f3fc;color:#2479ad}
  .agenda h3{color:#12493f}

  .hq-title{color:var(--coral);display:flex;align-items:center;gap:8px}
  .hq-title::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,#ffd9c9,transparent)}
  .sc{border-top:5px solid var(--mint)}
  .staff-grid .sc:nth-child(3n+2){border-top-color:var(--sky)}
  .staff-grid .sc:nth-child(3n+3){border-top-color:var(--sun)}
  .sc-h h4{color:#12493f}
  .sec{color:var(--mint);letter-spacing:.1em}
  dl.roles dt,dl.roles dd{border-top-color:#edf3f0}
  mark{background:#ffe27a}
  .pick{background:linear-gradient(135deg,#ffffff,#f0fbf7)}
  .pick b{color:#12493f}
  .pick::before{content:"👋";font-size:30px}

  .drawer h2{color:#12493f}
  .sched div{border:0;background:#f6faf8}
  .sched .main{background:var(--mint-soft)} .sched .reh{background:#fff0ea} .sched .mini{background:#eaf5fd}
  .sched .main b{color:#0e7c6b} .sched .reh b{color:#d4532f} .sched .mini b{color:#2479ad}

  .pbar{background:#eaf3ef;height:8px}
  .pbar i{background:linear-gradient(90deg,var(--mint),#7ad8a8)}
  .dchip{background:#f1f5f3}
  .dchip.done{background:var(--mint-soft);color:#0e7c6b}
  .rv-form h2{color:#12493f}
  .it-h .no{background:var(--mint)}
  .it:nth-child(3n) .it-h .no{background:var(--sky)}
  .it:nth-child(3n+1) .it-h .no{background:var(--coral)}
  .it .it-h .no.pre{background:#e7ecea;color:var(--muted)}
  .tbox{background:#f6fbf9;border-color:#e3efea}
  .tbox .tl{color:#0e7c6b}
  .field input,.field select,.rv-form textarea,.it input,.it textarea{border-color:#dfebe6;border-radius:12px}
  .field input:focus,.field select:focus,.rv-form textarea:focus,.it input:focus,.it textarea:focus{outline:2px solid #9fe3d4;border-color:#9fe3d4}
  .loadbar{background:#fff4d6}
  .loadbar button{background:var(--mint)}
  .submitbar{background:rgba(244,251,248,.94)}
  .total b{color:#12493f}
  .submitbar button{background:linear-gradient(135deg,var(--coral),#ff9f6b);border-radius:999px;box-shadow:0 6px 16px rgba(255,122,89,.35);padding:12px 28px}
  .toast{border-radius:999px;background:#12493f}
  .close{background:var(--mint-soft);color:var(--navy)}
  .dot.live{background:var(--mint);box-shadow:0 0 0 3px rgba(22,179,154,.2)}
  @media (max-width:600px){ h1{font-size:25px} nav.tabs button{font-size:14px} }
  .timer-hint{margin:10px 0 4px;border-radius:14px;padding:11px 14px;background:linear-gradient(135deg,#e3f7f1,#e9f4fd);font-size:13px;color:#2f5a52;line-height:1.7}
  .tbtn-demo{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--mint);color:#fff;font-size:9px;align-items:center;justify-content:center;vertical-align:1px}
  /* ===== 單項計時 ===== */
  .tbtn{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;
    background:var(--mint);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(22,179,154,.3);-webkit-tap-highlight-color:transparent}
  .tbox.running{border-color:var(--coral);background:#fff3ec}
  .tbox.running .tbtn{background:var(--coral);box-shadow:0 3px 8px rgba(255,122,89,.4);animation:pulse 1.2s infinite}
  .tbox.running input{font-weight:800;color:#d4532f}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,122,89,.15)}}
  /* ===== 檢視檢討結果 ===== */
  .rv-mode{margin-bottom:12px;display:flex;max-width:360px}
  .rv-mode button{flex:1}
  .rv-view{padding:14px}
  .rv-view-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .rv-view-bar select{flex:1;min-width:180px;border:1px solid #dfebe6;border-radius:12px;padding:9px 11px;min-height:42px;background:#fff}
  .rv-view-bar button{border:0;border-radius:999px;padding:9px 16px;background:var(--mint);color:#fff;font-weight:700;cursor:pointer}
  .rv-sheet h3{text-align:center;color:#12493f;margin:4px 0 10px;font-size:18px}
  .rv-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-bottom:10px;color:var(--ink)}
  .rv-meta b{color:var(--muted);font-weight:600;margin-right:6px}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid #e3efea}
  .rv-table{width:100%;min-width:640px;border-collapse:collapse;font-size:14px}
  .rv-table th{background:var(--mint-soft);color:#0e7c6b;text-align:left;padding:9px 10px;font-size:13px;white-space:nowrap}
  .rv-table td{padding:9px 10px;border-top:1px solid #edf3f0;vertical-align:top}
  .rv-table tbody tr:nth-child(even){background:#fafdfc}
  .rv-table .c-item{white-space:nowrap;font-weight:600}
  .rv-table .c-item .no{display:inline-flex;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--mint);color:#fff;font-size:11px;align-items:center;justify-content:center;margin-right:6px}
  .rv-table .c-item .no.pre{background:#e7ecea;color:var(--muted)}
  .rv-table .c-num{white-space:nowrap;font-variant-numeric:tabular-nums}
  .rv-table .c-num small{display:block;font-size:11px;color:var(--muted)}
  .rv-table .c-note{min-width:220px;line-height:1.6}
  .rv-table .na{color:#b8c4bf} .rv-table .blank{color:#c9a9a0;font-size:12px}
  .rv-table .over,.rv-sheet .over{color:#e0623e;font-weight:700} .rv-sheet .under{color:#2f8fcf;font-weight:700}
  .rv-table tr.nocount td{color:var(--muted)}
  .rv-table tfoot td{background:#f3faf7;font-weight:700;border-top:2px solid #d6ebe3}
  .rv-other{margin-top:12px;background:#fffaf0;border-radius:12px;padding:10px 14px;font-size:14px}
  .rv-other b{color:#b0702a} .rv-other p{margin:4px 0 0}
  .rv-table small.who{display:inline-block;margin-left:5px;font-size:11px;color:var(--muted);font-weight:400}
  .rv-table .c-num div + div{margin-top:2px}
  .rv-table .c-note div + div{margin-top:6px;padding-top:6px;border-top:1px dashed #e3efea}
  .who-b{display:inline-block;margin-right:6px;padding:0 7px;border-radius:8px;background:var(--mint-soft);color:#0e7c6b!important;font-size:12px;font-weight:700}
  .rv-multi{font-size:12px;color:var(--muted);margin:-2px 0 8px}
  @media screen and (max-width:600px){
    .tbl-wrap{overflow:visible}
    .rv-table{min-width:0}
    .rv-table thead{display:none}
    .rv-table tr{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;padding:10px 12px;border-top:1px solid #edf3f0}
    .rv-table tbody tr:first-child{border-top:0}
    .rv-table td{border:0;padding:2px 0}
    .rv-table .c-item,.rv-table .c-note{grid-column:1 / -1;min-width:0}
    .rv-table .c-item{margin-bottom:2px}
    .rv-table .c-num::before,.rv-table .c-note:not(:empty)::before{content:attr(data-label);display:block;font-size:11px;color:var(--muted);font-weight:400}
    .rv-table .c-note:not(:empty){margin-top:4px;background:#f7fbf9;border-radius:8px;padding:6px 8px}
    .rv-table tfoot td.c-note{background:none;padding:4px 0 0}
    .rv-table tfoot td.c-note::before{content:none}
  }
  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff!important}
    body *{visibility:hidden}
    #rvView,#rvView *{visibility:visible}
    #rvView{position:absolute;left:0;top:0;width:100%;box-shadow:none!important;padding:0}
    .noprint,#rvView .noprint{display:none!important}
    .tbl-wrap{overflow:visible;border-color:#ccc}
    .rv-table{min-width:0;font-size:12px}
    .rv-table th,.rv-table tfoot td,.rv-table .c-item .no{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .toast,.submitbar,header,.status,#filters,#rvForm,#rvProgress,#rvMode{display:none!important}
    main{padding:0}
  }
  /* ===== 頁首鼓勵話語 ===== */
  .hd-grid{display:grid;grid-template-columns:1fr;grid-template-areas:"main" "quote" "tabs";gap:4px}
  .hd-main{grid-area:main} .quote{grid-area:quote} .hd-grid nav.tabs{grid-area:tabs}
  .quote{
    position:relative;overflow:hidden;align-self:center;margin:2px 0 16px;
    background:linear-gradient(180deg,rgba(255,255,255,.92) 0%,rgba(240,250,255,.88) 100%);
    border-radius:22px;padding:18px 20px 34px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.9);
  }
  .quote::before{content:"“";position:absolute;right:14px;top:-18px;font-size:110px;line-height:1;color:rgba(22,179,154,.12);font-family:Georgia,serif;pointer-events:none}
  .q-by{display:inline-block;font-size:12px;font-weight:700;color:#0e7c6b;background:var(--mint-soft);padding:3px 10px;border-radius:999px;margin-bottom:10px;letter-spacing:.06em}
  .quote blockquote{margin:0;font-size:17px;font-weight:700;line-height:1.75;color:#173f38;letter-spacing:.03em}
  .quote blockquote span{display:block}
  .q-src{position:relative;z-index:1;text-align:right;font-size:12px;color:#4a6a63;margin-top:8px}
  .q-hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:30px;opacity:.85}
  @media (min-width:900px){
    .hd-grid{grid-template-columns:minmax(0,1fr) minmax(360px,460px);grid-template-areas:"main quote" "tabs quote";column-gap:28px;row-gap:0}
    .quote{align-self:end;margin:0}   /* 下緣對齊頁籤列 */
    .quote blockquote{font-size:18px}
  }
  @media (max-width:600px){
    .quote{padding:14px 16px 30px;border-radius:18px}
    .quote blockquote{font-size:15px;line-height:1.7}
    .quote blockquote span{display:inline}
  }
  [hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hd-grid">
      <div class="hd-main">
        <div class="eyebrow">台中中區 · 2027 年度</div>
        <h1>地區友好總會</h1>
        <div class="sub" id="range"></div>
        <div class="stats" id="stats"></div>
      </div>
      <aside class="quote" id="quote" hidden></aside>
      <nav class="tabs">
        <button class="on" data-tab="cal">行事曆</button>
        <button data-tab="staff">工作人員一覽</button>
        <button data-tab="review">彩排檢討</button>
      </nav>
    </div>
  </div>
</header>

<main class="wrap">
  <p class="status"><span class="dot" id="srcDot"></span><span id="srcText">資料載入中…</span></p>

  <div class="filters" id="filters">
    <select id="fHq" aria-label="本部"><option value="">全部本部</option></select>
    <select id="fBranch" aria-label="支部"><option value="">全部支部</option></select>
    <input id="fSearch" type="search" placeholder="在此支部中搜尋姓名" hidden>
    <div class="seg" id="viewSeg">
      <button class="on" data-view="month">月曆</button>
      <button data-view="list">列表</button>
    </div>
  </div>

  <!-- 行事曆 -->
  <section id="tab-cal">
    <div class="legend">
      <label><input type="checkbox" data-type="main" checked><span style="--c:var(--c-main)">正式場次</span></label>
      <label><input type="checkbox" data-type="reh" checked><span style="--c:var(--c-reh)">彩排</span></label>
      <label><input type="checkbox" data-type="mini" checked><span style="--c:var(--c-mini)">沙推／小彩排</span></label>
    </div>
    <div id="monthView">
      <div class="card">
        <div class="cal-head">
          <button id="prev" aria-label="上個月">‹</button>
          <h2 id="monthTitle"></h2>
          <button id="next" aria-label="下個月">›</button>
        </div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="agenda" id="dayAgenda"></div>
    </div>
    <div id="listView" class="agenda" hidden></div>
  </section>

  <!-- 工作人員 -->
  <section id="tab-staff" hidden>
    <p class="count" id="staffCount"></p>
    <div id="staffList"></div>
  </section>
  <!-- 彩排檢討 -->
  <section id="tab-review" hidden>
    <div class="seg rv-mode noprint" id="rvMode">
      <button type="button" class="on" data-m="form">填寫檢討表</button>
      <button type="button" data-m="view">檢視檢討結果</button>
    </div>
    <div class="card rv-progress noprint" id="rvProgress"></div>
    <form class="card rv-form" id="rvForm" autocomplete="off" novalidate>
      <h2>台中中區 地區總會彩排檢討表</h2>
      <p class="hint">請各地區在總會彩排結束後填寫送出。同一地區可以多人分別填寫、各自送出，不會互相覆蓋；同一人再次送出，會更新自己那一份。</p>
      <div class="fields">
        <label class="field req"><span>地區</span><select id="rvDistrict"></select></label>
        <label class="field"><span>彩排日期</span><input id="rvDate" type="date"></label>
        <label class="field req"><span>填寫人</span><input id="rvFiller" placeholder="姓名" maxlength="30"></label>
      </div>
      <div class="loadbar" id="loadbar"><span id="loadText"></span><button type="button" id="loadBtn">載入我上次的內容</button></div>
      <div class="timer-hint">⏱ 每一格時間右邊的 <span class="tbtn-demo">▶</span> 可以直接計時：按一下開始，再按一下停止，時間會自動填進那一格。</div>
      <div class="items" id="rvItems"></div>
      <label class="field other"><span>其他檢討建議事項</span><textarea id="rvOther" placeholder="場地、動線、器材、時間掌控……" maxlength="1000"></textarea></label>
      <div class="submitbar">
        <div class="total" id="rvTotal"></div>
        <button type="submit" id="rvSubmit">送出</button>
      </div>
    </form>
    <div class="card rv-view" id="rvView" hidden>
      <div class="rv-view-bar noprint">
        <select id="rvViewDistrict" aria-label="選擇地區"></select>
        <button type="button" id="rvPrint">🖨 列印／存成 PDF</button>
      </div>
      <div id="rvViewBody"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>



<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-modal="true" role="dialog">
  <div class="grab"></div>
  <button class="close" id="closeDrawer" aria-label="關閉">×</button>
  <div id="drawerBody"></div>
</aside>

<script>
/* ================================================================
   設定：部署 Apps Script 後，把網址貼在 API_URL
   ================================================================ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbx62-NK9vsRzDgKSLuaK732QAd0F4GheBsb5xfFpfyUeFRICW5XJklXHjxERMUd6QLz/exec',          // 例如 'https://script.google.com/macros/s/xxxxxx/exec'
  YEAR: 2026,           // 場次日期所在的年份（表上只有月/日）

  // 頁首右側的鼓勵話語：每一行一個字串；不想顯示時，把 lines 改成 []
  QUOTE: {
    by: '池田大作先生指導',
    lines: [
      '只要戰勝眼前這道超越自身極限的難關，',
      '眼前就會呈現出一片嶄新的風景。',
      '因此，再加把勁努力、再堅持一下，',
      '是非常重要的。'
    ],
    source: '摘自 2026.11.13《創價新聞》7版'
  }
};

/* 頁首鼓勵話語 */
(function renderQuote(){
  const q = CONFIG.QUOTE, el = document.getElementById('quote');
  if(!q || !q.lines || !q.lines.length) return;
  const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  el.innerHTML = `
    ${q.by ? `<div class="q-by">${e(q.by)}</div>` : ''}
    <blockquote>${q.lines.map(l => `<span>${e(l)}</span>`).join('')}</blockquote>
    ${q.source ? `<div class="q-src">——${e(q.source)}</div>` : ''}
    <svg class="q-hills" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 42 C 60 18, 120 20, 190 36 S 320 30, 400 14 L400 60 L0 60Z" fill="#bfe9c9"/>
      <path d="M0 52 C 80 34, 160 40, 240 50 S 350 44, 400 36 L400 60 L0 60Z" fill="#8fd6a3"/>
    </svg>`;
  el.hidden = false;
})();

/* 為保護個資，網站裡不保存任何名單；所有資料都即時從試算表讀取 */

/* ===== 工作人員欄位（對應 rows 的位置）===== */
const ROLE_GROUPS = [
  { name:'正式總會 · 投入幹部', roles:[[38,'青年部']] },
  { name:'節目', roles:[[17,'司儀'],[18,'司儀保母'],[19,'未來部表演'],[21,'幸福1+1體驗'],[22,'指導幹部'],[23,'地區聚光燈'],[16,'拍照／互動區']] },
  { name:'場務', roles:[[25,'場控'],[26,'催場'],[24,'剪影 PPT'],[27,'青年部音控'],[28,'金城會音效'],[29,'攝影']] },
  { name:'服務', roles:[[20,'服務負責人'],[33,'前輩引導'],[34,'台上引導'],[35,'台下引導'],[36,'遞獎者'],[37,'端獎者'],[30,'創價班負責人'],[31,'創價班'],[32,'創價班']] }
];
/* 彩排檢討項目：[序, 項目, 預計(分), 是否記錄串場時間, 是否計入合計, 是否記錄時間(預設是)]
   連上試算表後會改用 Code.gs 裡的 REVIEW_ITEMS */
const DEFAULT_REVIEW_ITEMS = [
  ['','地區活動剪影',30,false,false,false],['1','題目三唱',1,true,true],['2','司儀開場',1,false,true],
  ['3','未來部表演',5,false,true],['4','致歡迎詞',5,true,true],['5','頒贈禮物',5,true,true],
  ['6','年度影片',10,true,true],['7','地區聚光燈',5,true,true],['8','幸福1+1體驗',15,true,true],
  ['9','總結',7,true,true],['10','題目三唱',1,true,true],['11','大合照',5,true,true]
];
const TYPE_LABEL = { main:'正式場次', reh:'彩排', mini:'沙推／小彩排' };
const WD = ['日','一','二','三','四','五','六'];

/* ===== State ===== */
let districts = [];
let events = [];
let reviewItems = DEFAULT_REVIEW_ITEMS;
let reviews = [];      // [{district, updated}]
let apiLive = false;
const state = { tab:'cal', view:'month', hq:'', branch:'', q:'', types:new Set(['main','reh','mini']), month:null, sel:null };

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const br = s => esc(s).replace(/／/g, '<br>');
const key = d => `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
function parseMD(s){
  const m = String(s||'').match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
  return m ? new Date(CONFIG.YEAR, +m[1]-1, +m[2]) : null;
}
const fmtDate = d => `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
function hl(text, q){
  const h = br(text);
  if(!q) return h;
  const qq = esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return h.replace(new RegExp(qq,'g'), m => `<mark>${m}</mark>`);
}

/* ===== Data → model ===== */
function build(rows){
  districts = rows.map(r => {
    // 小彩排：有時日期寫在備註欄（例如「12/8／小彩」）
    let mDate = parseMD(r[11]), mNote = r[12];
    if(!mDate && parseMD(r[12])){ mDate = parseMD(r[12]); }
    mNote = (mNote||'').replace(/^[（(][一二三四五六日][)）]$/,'').replace(/^\d{1,2}\/\d{1,2}／?/,'');
    return {
      hq:r[0], branch:r[1], name:r[2], target:r[15], raw:r,
      main:{ date:parseMD(r[3]), time:r[5], venue:r[6] },
      reh: { date:parseMD(r[7]), time:r[9], venue:r[10] },
      mini:{ date:mDate, time:r[13], venue:r[14], note:mNote }
    };
  });
  events = [];
  districts.forEach(d => ['main','reh','mini'].forEach(t => {
    if(d[t].date) events.push({ type:t, d, date:d[t].date, time:d[t].time||'', venue:d[t].venue||'', note:d[t].note||'' });
  }));
  events.sort((a,b) => a.date - b.date || (a.time||'99').localeCompare(b.time||'99'));
}

function inFilter(d){
  return (!state.hq || d.hq === state.hq) && (!state.branch || d.branch === state.branch);
}
function visibleEvents(){
  return events.filter(e => inFilter(e.d) && state.types.has(e.type));
}

/* ===== Header ===== */
function renderHeader(){
  const mains = events.filter(e => e.type==='main');
  const first = mains[0]?.date, last = mains[mains.length-1]?.date;
  $('#range').textContent = first ? `正式場次 ${first.getMonth()+1}/${first.getDate()} – ${last.getMonth()+1}/${last.getDate()}` : '';
  const target = districts.reduce((s,d) => s + (parseInt(d.target)||0), 0);
  const today = new Date(); today.setHours(0,0,0,0);
  const next = mains.find(e => e.date >= today);
  const daysLeft = next ? Math.round((next.date - today)/864e5) : null;
  $('#stats').innerHTML = `
    <div class="stat"><b>${districts.length}</b>地區場次</div>
    <div class="stat"><b>${target.toLocaleString()}</b>出席目標</div>
    ${next ? `<div class="stat"><b>${daysLeft===0?'今天':daysLeft+' 天'}</b>下一場：${esc(next.d.name)}</div>` : ''}`;
}

function fillFilters(){
  const hqs = [...new Set(districts.map(d => d.hq))];
  $('#fHq').innerHTML = '<option value="">全部本部</option>' + hqs.map(h => `<option ${h===state.hq?'selected':''}>${esc(h)}</option>`).join('');
  fillBranches();
}
function fillBranches(){
  const brs = [...new Set(districts.filter(d => !state.hq || d.hq===state.hq).map(d => d.branch))];
  if(state.branch && !brs.includes(state.branch)) state.branch = '';
  $('#fBranch').innerHTML = '<option value="">全部支部</option>' + brs.map(b => `<option ${b===state.branch?'selected':''}>${esc(b)}</option>`).join('');
}

/* ===== Calendar ===== */
function monthsWithEvents(){
  const s = new Set(events.map(e => `${e.date.getFullYear()}-${e.date.getMonth()}`));
  return [...s].map(x => x.split('-').map(Number)).sort((a,b) => a[0]-b[0] || a[1]-b[1]);
}
function renderMonth(){
  const [y,m] = state.month;
  $('#monthTitle').textContent = `${y} 年 ${m+1} 月`;
  const ms = monthsWithEvents();
  const idx = ms.findIndex(x => x[0]===y && x[1]===m);
  $('#prev').disabled = idx <= 0;
  $('#next').disabled = idx === -1 || idx >= ms.length-1;

  const byDay = {};
  visibleEvents().forEach(e => (byDay[key(e.date)] ||= []).push(e));

  const first = new Date(y,m,1), start = new Date(y,m,1-first.getDay());
  const lastDay = new Date(y,m+1,0);
  const cells = Math.ceil((first.getDay() + lastDay.getDate())/7)*7;
  const todayK = key(new Date());
  let html = WD.map((w,i) => `<div class="dow ${i===0||i===6?'we':''}">${w}</div>`).join('');
  for(let i=0;i<cells;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const out = d.getMonth() !== m, k = key(d), evs = byDay[k] || [];
    const chips = evs.slice(0,3).map(e => `<span class="chip ${e.type}">${e.type==='main'?'':TYPE_LABEL[e.type].slice(0,2)+'・'}${esc(e.d.name)}</span>`).join('')
      + (evs.length>3 ? `<span class="more">+${evs.length-3}</span>` : '');
    const dots = evs.map(e => `<i class="${e.type}"></i>`).join('');
    html += `<button class="day ${out?'out':''} ${k===todayK?'today':''} ${state.sel===k?'sel':''}" ${out?'disabled':''} data-k="${k}">
      <span class="n">${d.getDate()}</span>${out?'':`<div class="chips">${chips}</div><div class="dots">${dots}</div>`}</button>`;
  }
  $('#grid').innerHTML = html;
  $('#grid').querySelectorAll('.day:not(.out)').forEach(b => b.onclick = () => { state.sel = b.dataset.k; renderMonth(); });
  renderDayAgenda(byDay);
}
function renderDayAgenda(byDay){
  const el = $('#dayAgenda');
  if(!state.sel){ el.innerHTML = ''; return; }
  const [y,m,d] = state.sel.split('-').map(Number);
  const date = new Date(y,m-1,d);
  const evs = byDay[state.sel] || [];
  el.innerHTML = `<h3>${fmtDate(date)}<small>${evs.length ? evs.length+' 項' : ''}</small></h3>` +
    (evs.length ? evs.map(evHTML).join('') : '<div class="empty">這天沒有安排</div>');
  bindEv(el);
}
function evHTML(e){
  const d = e.d;
  return `<button class="ev" data-n="${esc(d.name)}">
    <span class="bar ${e.type}"></span>
    <span class="time">${esc(e.time||'—')}</span>
    <span><span class="t">${esc(d.name)}</span><span class="tag ${e.type}">${TYPE_LABEL[e.type]}</span>
      <div class="meta">${esc(d.branch)}支部 · ${esc(e.venue||'地點未定')}${e.note?' · '+esc(e.note):''}</div></span>

}
function bindEv(root){ root.querySelectorAll('.ev').forEach(b => b.onclick = () => openDistrict(b.dataset.n)); }

function renderList(){

function rolesHTML(d, q){
  return ROLE_GROUPS.map(g => {

    const merged = [];
    g.roles.forEach(([i,label]) => {
      const v = d.raw[i];
      if(!v) return;
      const ex = merged.find(x => x.label===label);
      ex ? ex.vals.push(v) : merged.push({label, vals:[v]});

    return `<div class="sec">${g.name}</div><dl class="roles">` +
      merged.map(x => `<dt>${x.label}</dt><dd>${hl(x.vals.join('、'), q)}</dd>`).join('') + '</dl>';

/* ===== Storage（瀏覽器暫存：通關碼、草稿）===== */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function toast(msg, err){

/* 分、秒欄位 ↔ 秒數 */
function getSec(el, f){
  const m = el.querySelector(`[data-f=${f}m]`), s = el.querySelector(`[data-f=${f}s]`);
  if(!m) return '';
  if(m.value === '' && s.value === '') return '';
  return Math.max(0, Math.round((+m.value || 0) * 60 + (+s.value || 0)));
}
function setSec(el, f, v){
  const m = el.querySelector(`[data-f=${f}m]`), s = el.querySelector(`[data-f=${f}s]`);
  if(!m) return;
  if(v === '' || v == null || isNaN(+v)){ m.value = ''; s.value = ''; return; }
  m.value = Math.floor(+v / 60); s.value = +v % 60;
}
function fmtSec(t){
  const m = Math.floor(t / 60), r = t % 60;
  if(!m) return r + '秒';
  return r ? `${m}分${r}秒` : `${m}分`;
}

function collect(){
  const items = [...document.querySelectorAll('#rvItems .it')].map(el => ({
    cue: getSec(el, 'cue'), prog: getSec(el, 'prog'),
    note: el.querySelector('[data-f=note]').value
  }));
  const d = districts.find(x => x.name === $('#rvDistrict').value);
  return {
    district: $('#rvDistrict').value, hq: d?.hq || '', branch: d?.branch || '',
    date: $('#rvDate').value.replace(/-/g,'/'), filler: $('#rvFiller').value.trim(),
    items, other: $('#rvOther').value
  };
}
function fill(data){
  const els = document.querySelectorAll('#rvItems .it');
  els.forEach((el,i) => {
    const v = (data.items || [])[i] || {};
    setSec(el, 'cue', v.cue ?? '');
    setSec(el, 'prog', v.prog ?? '');
    el.querySelector('[data-f=note]').value = v.note ?? '';
  });
  $('#rvOther').value = data.other ?? '';
  if(data.date) $('#rvDate').value = String(data.date).replace(/\//g,'-');
  if(data.filler && !$('#rvFiller').value) $('#rvFiller').value = data.filler;
  document.querySelectorAll('#rvForm textarea').forEach(autoGrow);
  updateTotal();
}
function clearItems(){ fill({ items:[], other:'' }); }

function updateTotal(){
  let actual = 0, plan = 0, filled = 0;
  document.querySelectorAll('#rvItems .it').forEach((el,i) => {
    const [, , p, , count] = reviewItems[i];
    const c = getSec(el, 'cue'), g = getSec(el, 'prog');
    const diff = el.querySelector('.diff');
    if(c !== '' || g !== ''){
      const t = (c || 0) + (g || 0), dv = t - p * 60;
      diff.textContent = `・小計 ${fmtSec(t)}` + (dv > 0 ? `（超過 ${fmtSec(dv)}）` : dv < 0 ? `（少 ${fmtSec(-dv)}）` : '');
      diff.className = 'diff ' + (dv > 0 ? 'over' : dv < 0 ? 'under' : 'ok');
      if(count){ actual += t; filled++; }
    } else diff.textContent = '';
    if(count) plan += p;
  });
  const d = actual - plan * 60;
  $('#rvTotal').innerHTML = filled
    ? `實際合計 <b>${fmtSec(actual)}</b><br>預計 ${plan} 分 · <span class="d" style="color:${d>0?'#e0623e':d<0?'#2f8fcf':'#0e9c84'}">${d>0?'超過 '+fmtSec(d):d<0?'少 '+fmtSec(-d):'剛好'}</span>`
    : `預計合計 <b>${plan}</b> 分<br>填入時間後自動加總`;
}
function autoGrow(t){ t.style.height = 'auto'; t.style.height = Math.max(42, t.scrollHeight + 2) + 'px'; }

function saveDraft(){
  const d = $('#rvDistrict').value; if(!d) return;
  store.set('rvDraft:' + d, collect());
}

const normName = s => String(s || '').replace(/\s+/g, '');

function onDistrictChange(){
  const name = $('#rvDistrict').value;
  const d = districts.find(x => x.name === name);
  $('#rvDate').value = d ? isoDate(d.reh.date) : '';
  clearItems();
  const draft = name && store.get('rvDraft:' + name);
  if(draft) fill(draft);
  updateLoadbar(!!draft);
}

/* 顯示這個地區已經有誰送出；填寫人是自己時，才出現「載入我上次的內容」 */
function updateLoadbar(hasDraft){
  const name = $('#rvDistrict').value;
  const done = reviews.find(r => r.district === name);
  if(!name || !done){ $('#loadbar').classList.remove('show'); return; }
  const fillers = done.fillers || [];
  const me = normName($('#rvFiller').value);
  const mine = !!me && fillers.some(f => normName(f) === me);
  $('#loadText').textContent = `${name} 已有 ${fillers.length || 1} 人送出` +
    (fillers.length ? `（${fillers.join('、')}）` : '') +
    (mine ? '，包含你上次送出的紀錄' : '') +
    (hasDraft ? '。目前顯示的是這台裝置上的草稿' : '');
  $('#loadBtn').hidden = !mine;
  $('#loadbar').classList.add('show');
}

async function loadExisting(){
  const name = $('#rvDistrict').value, filler = $('#rvFiller').value.trim();
  if(!filler){ toast('請先填寫填寫人', true); $('#rvFiller').focus(); return; }
  $('#loadBtn').disabled = true;
  try{
    const r = await api({ action:'load', pass:'', district:name, filler });
    if(!r.ok) throw new Error(r.error);
    if(!r.data){ toast(`找不到 ${filler} 在 ${name} 送出的紀錄`, true); return; }
    fill(r.data); saveDraft();
    toast('已載入你上次送出的內容');
  }catch(e){ toast(e.message || '載入失敗，請稍後再試', true); }
  finally{ $('#loadBtn').disabled = false; }
}

async function submitReview(ev){
  ev.preventDefault();
  const data = collect(), pass = '';
  if(!data.district){ toast('請選擇地區', true); $('#rvDistrict').focus(); return; }
  if(!data.filler){ toast('請填寫填寫人', true); $('#rvFiller').focus(); return; }
  if(!CONFIG.API_URL){ toast('網站尚未連接試算表，暫時無法送出', true); return; }
  const btn = $('#rvSubmit'); btn.disabled = true; btn.textContent = '送出中…';
  try{
    const r = await api({ action:'submit', pass, data });
    if(!r.ok) throw new Error(r.error);
    store.set('rvMeta', { filler:data.filler });
    store.del('rvDraft:' + data.district);
    let rec = reviews.find(x => x.district === data.district);
    if(!rec){ rec = { district:data.district, updated:'', fillers:[] }; reviews.push(rec); }
    rec.updated = r.updated;
    rec.fillers ||= [];
    if(!rec.fillers.some(f => normName(f) === normName(data.filler))) rec.fillers.push(data.filler);
    delete viewCache[data.district];
    renderProgress();
    updateLoadbar(false);
    toast(r.overwritten ? `已更新你在 ${data.district} 的檢討表` : `已送出 ${data.district} 的檢討表，謝謝！`);
  }catch(e){
    toast(e.message === 'Failed to fetch' ? '網路連線失敗，內容已暫存在這台裝置，請稍後再送一次' : (e.message || '送出失敗'), true);
  }finally{ btn.disabled = false; btn.textContent = '送出'; }
}

$('#rvForm').addEventListener('change', e => {

});

/* ===== 計時共用工具 ===== */
const now = () => Date.now();
const W = { lock:null };
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !W.lock) W.lock = await navigator.wakeLock.request('screen');
    if(!on && W.lock){ await W.lock.release(); W.lock = null; }
  }catch(e){ W.lock = null; }
}
store.del('rvTimer');   // 清掉舊版連續計時留下的暫存

/* ================================================================
   單項計時（做法 A）
   每個「串場／程序／實際」欄位旁的 ▶：按一下開始，再按一下停止。
   欄位已經有時間的話，會從那個時間接著計（可當作暫停／繼續）。
   ================================================================ */
const FT = { cur:null, tick:null };

function ftBox(c){
  const el = document.querySelector(`#rvItems .it[data-i="${c.i}"]`);
  return el ? { el, box: el.querySelector(`[data-f=${c.f}m]`)?.closest('.tbox') } : {};
}
function ftMs(){ return FT.cur ? FT.cur.base + (now() - FT.cur.t0) : 0; }

function ftStart(i, f){
  if(!$('#rvDistrict').value){ toast('請先選擇地區，再開始計時', true); $('#rvDistrict').focus(); return; }
  if(FT.cur) ftStop();
  const el = document.querySelector(`#rvItems .it[data-i="${i}"]`);
  const base = (getSec(el, f) || 0) * 1000;
  FT.cur = { district:$('#rvDistrict').value, i, f, base, t0:now() };
  store.set('rvFT', FT.cur);
  clearInterval(FT.tick); FT.tick = setInterval(ftRender, 250);
  keepAwake(true); ftRender(); lockDistrict();
}
function ftStop(){
  if(!FT.cur) return;
  const { el } = ftBox(FT.cur);
  if(el) setSec(el, FT.cur.f, Math.round(ftMs() / 1000));
  FT.cur = null; store.del('rvFT');
  clearInterval(FT.tick); FT.tick = null;
  keepAwake(false); ftRender(); updateTotal(); saveDraft(); lockDistrict();
}
function ftRender(){
  document.querySelectorAll('#rvItems .tbox.running').forEach(b => {
    b.classList.remove('running'); const btn = b.querySelector('.tbtn'); btn.textContent = '▶'; btn.setAttribute('aria-pressed','false');
  });
  if(!FT.cur) return;
  const { el, box } = ftBox(FT.cur);
  if(!el || !box) return;
  box.classList.add('running');
  const btn = box.querySelector('.tbtn'); btn.textContent = '■'; btn.setAttribute('aria-pressed','true');
  setSec(el, FT.cur.f, Math.floor(ftMs() / 1000));
  updateTotal();
}
function ftResume(){
  const saved = store.get('rvFT');
  if(!saved || !districts.some(d => d.name === saved.district)){ store.del('rvFT'); return; }
  FT.cur = saved;
  $('#rvDistrict').value = saved.district; onDistrictChange();
  FT.tick = setInterval(ftRender, 250); ftRender(); lockDistrict();
}
function lockDistrict(){ $('#rvDistrict').disabled = !!FT.cur; }
$('#rvItems').addEventListener('click', e => {
  const btn = e.target.closest('.tbtn'); if(!btn) return;
  const i = +btn.closest('.it').dataset.i, f = btn.dataset.t;
  (FT.cur && FT.cur.i === i && FT.cur.f === f) ? ftStop() : ftStart(i, f);
});
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && FT.cur){ W.lock = null; keepAwake(true); }
});



/* ================================================================
   檢視檢討結果：選地區 → 讀取已送出的檢討表 → 整理成表格
   ================================================================ */
let rvMode = 'form';
const viewCache = {};

function setRvMode(m){
  rvMode = m;
  document.querySelectorAll('#rvMode button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('#rvForm').hidden = m !== 'form';
  $('#rvView').hidden = m !== 'view';
  if(m === 'view'){
    fillViewSelect();
    const sel = $('#rvViewDistrict').value;
    sel ? showReview(sel) : renderViewEmpty();
  }
}
function fillViewSelect(){
  const sel = $('#rvViewDistrict'); if(!sel) return;
  const cur = sel.value;
  const cnt = new Map(reviews.map(r => [r.district, r.fillers?.length || 1]));
  const groups = {};
  districts.forEach(d => (groups[d.hq+'本部 · '+d.branch+'支部'] ||= []).push(d));
  sel.innerHTML = '<option value="">請選擇地區</option>' + Object.entries(groups).map(([g,ds]) =>
    `<optgroup label="${esc(g)}">${ds.map(d => `<option value="${esc(d.name)}" ${d.name===cur?'selected':''}>${esc(d.name)}${cnt.has(d.name)?`　✓ ${cnt.get(d.name)} 人送出`:'　（尚未回傳）'}</option>`).join('')}</optgroup>`).join('');
}
function renderViewEmpty(msg){
  $('#rvViewBody').innerHTML = `<div class="empty">${msg || '請選擇地區，或點上方已回傳（✓）的地區'}</div>`;
}

async function showReview(name){
  if(!name){ renderViewEmpty(); return; }
  if(!CONFIG.API_URL){ renderViewEmpty('網站尚未連接試算表，暫時無法檢視'); return; }
  if(!reviews.some(r => r.district === name)){ renderViewEmpty(`${esc(name)} 還沒有送出檢討表`); return; }
  $('#rvViewBody').innerHTML = '<div class="empty">讀取中…</div>';
  try{
    const r = await api({ action:'view', pass:'', district:name });
    if(!r.ok) throw new Error(r.error);
    if(!r.records || !r.records.length){ renderViewEmpty(`${esc(name)} 還沒有送出檢討表`); return; }
    viewCache[name] = r.records;
    if($('#rvViewDistrict').value === name) renderReviewTable(name, r.records);
  }catch(e){ renderViewEmpty('讀取失敗，請稍後再試'); }
}

function renderReviewTable(name, records){
  const d = districts.find(x => x.name === name) || {};
  const multi = records.length > 1;
  const has = v => v !== '' && v != null && !isNaN(+v);
  const tagName = n => multi ? `<small class="who">${esc(n)}</small>` : '';

  // 每位記錄者各自的合計
  const per = records.map(rec => {
    const o = { name: rec.filler, cue:0, prog:0 };
    reviewItems.forEach((it,i) => { if(it[4]){ const v = rec.items?.[i] || {}; if(has(v.cue)) o.cue += +v.cue; if(has(v.prog)) o.prog += +v.prog; } });
    return o;
  });
  let planTotal = 0; reviewItems.forEach(it => { if(it[4]) planTotal += it[2]; });

  // 一格時間：只有一個值（或大家都一樣）就直接顯示；不一樣就逐人並列
  function timeCell(i, f, plan){
    const vals = records.map(rec => ({ n: rec.filler, v: rec.items?.[i]?.[f], tot: (+rec.items?.[i]?.cue || 0) + (+rec.items?.[i]?.prog || 0) }))
      .filter(x => has(x.v));
    if(!vals.length) return { html:'<span class="blank">未填</span>', over:false };
    const same = vals.every(x => +x.v === +vals[0].v);
    if(same) return { html: fmtSec(+vals[0].v) + (multi && vals.length > 1 ? `<small class="who">${vals.length} 人相同</small>` : multi ? tagName(vals[0].n) : ''), over: f === 'prog' && vals.some(x => x.tot > plan * 60) };
    return { html: vals.map(x => `<div class="${f === 'prog' && x.tot > plan * 60 ? 'over' : ''}">${fmtSec(+x.v)}${tagName(x.n)}</div>`).join(''), over:false };
  }

  const rows = reviewItems.map((it, i) => {
    const [no, nm, plan, cue, count] = it, timed = it[5] !== false;
    const c = timed && cue ? timeCell(i, 'cue', plan) : null;
    const p = timed ? timeCell(i, 'prog', plan) : null;
    const notes = records.map(rec => ({ n: rec.filler, t: rec.items?.[i]?.note })).filter(x => x.t);
    return `<tr class="${count ? '' : 'nocount'}">
      <td class="c-item"><span class="no ${no?'':'pre'}">${no ? esc(no) : '開場前'}</span>${esc(nm)}</td>
      <td class="c-num" data-label="預計">${plan} 分${count ? '' : '<small>不計入合計</small>'}</td>
      <td class="c-num" data-label="串場">${!timed ? '<span class="na">不需記錄</span>' : c ? c.html : '<span class="na">—</span>'}</td>
      <td class="c-num ${p && p.over ? 'over' : ''}" data-label="程序">${!timed ? '<span class="na">不需記錄</span>' : p.html}</td>
      <td class="c-note" data-label="檢討內容">${notes.map(x => `<div>${multi ? `<b class="who-b">${esc(x.n)}</b>` : ''}${br(String(x.t).replace(/\n/g,'／'))}</div>`).join('')}</td>
    </tr>`;
  }).join('');

  const diffText = t => { const df = t - planTotal * 60; return df > 0 ? `<span class="over">超過 ${fmtSec(df)}</span>` : df < 0 ? `<span class="under">少 ${fmtSec(-df)}</span>` : '剛好'; };
  const foot = multi
    ? `<td class="c-num" data-label="串場">${per.map(x => `<div>${fmtSec(x.cue)}${tagName(x.name)}</div>`).join('')}</td>
       <td class="c-num" data-label="程序">${per.map(x => `<div>${fmtSec(x.prog)}${tagName(x.name)}</div>`).join('')}</td>
       <td class="c-note">${per.map(x => `<div><b class="who-b">${esc(x.name)}</b>實際共 <b>${fmtSec(x.cue + x.prog)}</b>，${diffText(x.cue + x.prog)}</div>`).join('')}</td>`
    : `<td class="c-num" data-label="串場">${fmtSec(per[0].cue)}</td><td class="c-num" data-label="程序">${fmtSec(per[0].prog)}</td>
       <td class="c-note">實際共 <b>${fmtSec(per[0].cue + per[0].prog)}</b>，${diffText(per[0].cue + per[0].prog)}</td>`;

  const latest = records.map(r => r.updated || '').sort().pop();
  const date = (records.find(r => r.date) || {}).date || '';
  const others = records.filter(r => r.other);

  $('#rvViewBody').innerHTML = `
    <div class="rv-sheet">
      <h3>台中中區 地區總會彩排檢討表</h3>
      <div class="rv-meta">
        <span><b>地區</b>${esc(name)}${d.branch ? `（${esc(d.hq)}本部 · ${esc(d.branch)}支部）` : ''}</span>
        <span><b>彩排日期</b>${esc(date)}</span>
        <span><b>填寫人</b>${records.map(r => esc(r.filler)).join('、')}</span>
        <span><b>最後更新</b>${esc(latest)}</span>
      </div>
      ${multi ? `<p class="rv-multi">共 ${records.length} 位記錄者。時間相同時只顯示一次；不同時會並列每個人的紀錄，並標上姓名。</p>` : ''}
      <div class="tbl-wrap"><table class="rv-table">
        <thead><tr><th>項目</th><th>預計時間</th><th>串場時間</th><th>程序時間</th><th>檢討內容</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td class="c-item">合計</td><td class="c-num" data-label="預計">${planTotal} 分</td>${foot}</tr></tfoot>
      </table></div>
      ${others.length ? `<div class="rv-other"><b>其他檢討建議事項</b>${others.map(r => `<p>${multi ? `<b class="who-b">${esc(r.filler)}</b>` : ''}${br(String(r.other).replace(/\n/g,'／'))}</p>`).join('')}</div>` : ''}
    </div>`;
}

document.querySelectorAll('#rvMode button').forEach(b => b.onclick = () => setRvMode(b.dataset.m));
$('#rvViewDistrict').onchange = e => showReview(e.target.value);
$('#rvPrint').onclick = () => {
  if(!$('#rvViewBody .rv-sheet')){ toast('請先選擇已回傳的地區', true); return; }
  window.print();
};

/* ===== Render ===== */
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===state.tab));
  $('#tab-cal').hidden = state.tab!=='cal';
  $('#tab-staff').hidden = state.tab!=='staff';
  $('#tab-review').hidden = state.tab!=='review';
  $('#filters').hidden = state.tab==='review';
  $('#viewSeg').hidden = state.tab!=='cal';
  $('#fSearch').hidden = state.tab!=='staff';
  if(state.tab==='cal'){
    document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.view===state.view));
    $('#monthView').hidden = state.view!=='month';
    $('#listView').hidden = state.view!=='list';
    state.view==='month' ? renderMonth() : renderList();
  } else if(state.tab==='staff') renderStaff();
  else { if(!rvReady) setupReview(); renderProgress(); }
}

/* ===== Events ===== */
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => { state.view = b.dataset.view; state._scrollList = b.dataset.view==='list'; render(); });
$('#fHq').onchange = e => { state.hq = e.target.value; fillBranches(); render(); };
$('#fBranch').onchange = e => {
  state.branch = e.target.value;
  // 只選支部時，自動帶入所屬本部
  const d = districts.find(x => x.branch === state.branch);
  if(state.branch && d && !state.hq){ state.hq = d.hq; fillFilters(); }
  render();
};
$('#fSearch').oninput = e => { state.q = e.target.value; render(); };
document.querySelectorAll('.legend input').forEach(c => c.onchange = () => { c.checked ? state.types.add(c.dataset.type) : state.types.delete(c.dataset.type); render(); });
$('#prev').onclick = () => stepMonth(-1);
$('#next').onclick = () => stepMonth(1);
function stepMonth(n){
  const ms = monthsWithEvents();
  const i = ms.findIndex(x => x[0]===state.month[0] && x[1]===state.month[1]);
  if(ms[i+n]){ state.month = ms[i+n]; state.sel = null; render(); }
}

/* ===== Boot ===== */
function start(rows, source, extra = {}){
  if(Array.isArray(extra.reviewItems) && extra.reviewItems.length) reviewItems = extra.reviewItems;
  reviews = extra.reviews || [];
  apiLive = !!source.live;
  build(rows);
  const today = new Date(); today.setHours(0,0,0,0);
  const next = events.find(e => e.date >= today) || events[0];
  const focus = next ? next.date : today;
  state.month = [focus.getFullYear(), focus.getMonth()];
  state.sel = key(focus);
  const qTab = new URLSearchParams(location.search).get('tab');
  if(['cal','staff','review'].includes(qTab)) state.tab = qTab;
  renderHeader(); fillFilters(); render();
  $('#srcDot').classList.toggle('live', source.live);
  $('#srcText').textContent = source.text;
}

async function boot(){
  if(!CONFIG.API_URL){
    start([], { live:false, text:'網站尚未連接 Google 試算表（請在 index.html 填入 API_URL）' });
    return;
  }
  try{
    const res = await fetch(CONFIG.API_URL, { cache:'no-store' });
    const data = await res.json();
    if(!Array.isArray(data.rows)) throw new Error('bad data');
    start(data.rows, { live:true, text:`與 Google 試算表同步 · 更新於 ${data.updated}` }, data);
  }catch(err){
    console.warn('API 讀取失敗', err);
    start([], { live:false, text:'暫時無法連線到 Google 試算表，請檢查網路後重新整理' });
  }
}
boot();
</script>
